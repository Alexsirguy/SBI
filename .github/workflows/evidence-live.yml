name: Evidence connectors (live)

# Europe PMC, Crossref, Wikipedia and agency pages can change without notice; PR CI never calls them.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    name: Live retrieval check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Retrieval only: the judge tests skip without a model key, so no secrets are needed.
      - name: Run live retrieval tests
        id: live
        env:
          EVIDENCE_LIVE: "1"
        run: pnpm --filter @sbi/evidence exec vitest run src/retrieval/retrieval.live.test.ts

      - name: Open or update the tracking issue
        if: failure() && steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Evidence connectors: live check failing"
          body="The weekly live retrieval check failed: $RUN_URL. A source API may have changed its response. Re-run with \`EVIDENCE_LIVE=1 pnpm --filter @sbi/evidence test\`."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ] && [ "$number" != "null" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "area:evidence"
          fi
