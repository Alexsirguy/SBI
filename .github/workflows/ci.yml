name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      TEST_DATABASE_URL: mysql://sbi:sbi@127.0.0.1:3306/sbi_test
      TEST_S3_ENDPOINT: http://127.0.0.1:8333
      TEST_CLAMAV_HOST: 127.0.0.1
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_USER: sbi
          MARIADB_PASSWORD: sbi
          MARIADB_DATABASE: sbi_test
          MARIADB_ROOT_PASSWORD: sbi-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Service containers cannot take a command, so SeaweedFS and ClamAV come from compose.
      - name: Start object storage and malware scanner
        run: docker compose up -d --wait storage clamav

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @sbi/contracts generate:check
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # A dummy token so the build sends usage events; tests intercept them before any network.
      NEXT_PUBLIC_MIXPANEL_TOKEN: e2e-token
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sbi/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
