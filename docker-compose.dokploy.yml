# Production stack for Dokploy; values come from the Environment tab (infra/dokploy/.env.example).
name: sbi-dokploy

x-database: &database
  DB_HOST: ${DB_HOST:?set DB_HOST}
  DB_PORT: ${DB_PORT:-3306}
  DB_USER: ${DB_USER:?set DB_USER}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
  DB_NAME: ${DB_NAME:?set DB_NAME}

services:
  clamav:
    image: clamav/clamav-debian:1.4
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      # The first start downloads and loads the signature database.
      start_period: 5m

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      <<: *database

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    expose:
      - "4000"
    environment:
      <<: *database
      PORT: 4000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      WEB_ORIGINS: ${WEB_ORIGINS:?set WEB_ORIGINS}
      UPLOAD_TOKEN_SECRET: ${UPLOAD_TOKEN_SECRET:?set UPLOAD_TOKEN_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      FEATURE_FLAGS: ${FEATURE_FLAGS:-}
      META_MODEL_API_KEY: ${META_MODEL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RECOGNITION_PROVIDERS: ${RECOGNITION_PROVIDERS:-}
      RECOGNITION_TIMEOUT_MS: ${RECOGNITION_TIMEOUT_MS:-}
      RECOGNITION_BAND_LIKELY: ${RECOGNITION_BAND_LIKELY:-}
      RECOGNITION_BAND_POSSIBLE: ${RECOGNITION_BAND_POSSIBLE:-}
      RECOGNITION_LESSON_MIN_CERTAINTY: ${RECOGNITION_LESSON_MIN_CERTAINTY:-}
      RECOGNITION_LESSON_MIN_MARGIN: ${RECOGNITION_LESSON_MIN_MARGIN:-}
      RECOGNITION_RESULT_TTL_DAYS: ${RECOGNITION_RESULT_TTL_DAYS:-}
      LESSON_MODEL: ${LESSON_MODEL:-}
      LESSON_PRICE_INPUT_PER_MTOK: ${LESSON_PRICE_INPUT_PER_MTOK:-}
      LESSON_PRICE_CACHED_INPUT_PER_MTOK: ${LESSON_PRICE_CACHED_INPUT_PER_MTOK:-}
      LESSON_PRICE_OUTPUT_PER_MTOK: ${LESSON_PRICE_OUTPUT_PER_MTOK:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ZEPTOMAIL_TOKEN: ${ZEPTOMAIL_TOKEN:?set ZEPTOMAIL_TOKEN}
      ZEPTOMAIL_FROM: ${ZEPTOMAIL_FROM:?set ZEPTOMAIL_FROM}
      ZEPTOMAIL_FROM_NAME: ${ZEPTOMAIL_FROM_NAME:-Science Behind It}
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL:-https://api.zeptomail.com/v1.1/email}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      EVIDENCE_CONTACT: ${EVIDENCE_CONTACT:-}
      EVIDENCE_BUDGET_MS: ${EVIDENCE_BUDGET_MS:-120000}
      EVIDENCE_RECHECK_INTERVAL_MINUTES: ${EVIDENCE_RECHECK_INTERVAL_MINUTES:-360}
      EVIDENCE_MAX_AGE_DAYS: ${EVIDENCE_MAX_AGE_DAYS:-30}
      EVIDENCE_RECHECK_BATCH: ${EVIDENCE_RECHECK_BATCH:-20}
      MEDIA_TTL_ORIGINAL_DAYS: ${MEDIA_TTL_ORIGINAL_DAYS:-}
      MEDIA_TTL_DERIVATIVE_DAYS: ${MEDIA_TTL_DERIVATIVE_DAYS:-}
      MEDIA_TTL_LOG_DAYS: ${MEDIA_TTL_LOG_DAYS:-}
      MEDIA_TTL_AUDIT_DAYS: ${MEDIA_TTL_AUDIT_DAYS:-}
      MEDIA_TTL_RECOGNISED_GRACE_HOURS: ${MEDIA_TTL_RECOGNISED_GRACE_HOURS:-}
      MEDIA_TTL_STAGING_HOURS: ${MEDIA_TTL_STAGING_HOURS:-}
      MEDIA_PURGE_INTERVAL_MINUTES: ${MEDIA_PURGE_INTERVAL_MINUTES:-15}
      FEEDBACK_DETAILS_RETENTION_DAYS: ${FEEDBACK_DETAILS_RETENTION_DAYS:-90}
      FEEDBACK_MAX_PER_HOUR: ${FEEDBACK_MAX_PER_HOUR:-20}
      QUESTIONS_MAX_PER_HOUR: ${QUESTIONS_MAX_PER_HOUR:-60}
      TUTOR_MAX_PER_HOUR: ${TUTOR_MAX_PER_HOUR:-30}
      TUTOR_TTL_SESSION_HOURS: ${TUTOR_TTL_SESSION_HOURS:-}
      TUTOR_TTL_ACCOUNT_DAYS: ${TUTOR_TTL_ACCOUNT_DAYS:-}
      TUTOR_TTL_QUALITY_DAYS: ${TUTOR_TTL_QUALITY_DAYS:-}
      TUTOR_TTL_RESEARCH_DAYS: ${TUTOR_TTL_RESEARCH_DAYS:-}
      EVIDENCE_PACK_TTL_DAYS: ${EVIDENCE_PACK_TTL_DAYS:-}
      CATALOG_GAP_TTL_DAYS: ${CATALOG_GAP_TTL_DAYS:-}

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_FEATURE_FLAGS: ${NEXT_PUBLIC_FEATURE_FLAGS:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_MIXPANEL_TOKEN: ${NEXT_PUBLIC_MIXPANEL_TOKEN:-}
        NEXT_PUBLIC_CAPTURE_MAX_DIMENSION: ${NEXT_PUBLIC_CAPTURE_MAX_DIMENSION:-}
        NEXT_PUBLIC_CAPTURE_JPEG_QUALITY: ${NEXT_PUBLIC_CAPTURE_JPEG_QUALITY:-}
        NEXT_PUBLIC_CAPTURE_MAX_UPLOAD_MB: ${NEXT_PUBLIC_CAPTURE_MAX_UPLOAD_MB:-}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_MIXPANEL_TOKEN: ${NEXT_PUBLIC_MIXPANEL_TOKEN:-}

volumes:
  clamav-data:
