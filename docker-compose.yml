name: sbi

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sbi
      POSTGRES_PASSWORD: sbi
      POSTGRES_DB: sbi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbi"]
      interval: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - storage-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres-data:
  storage-data:
