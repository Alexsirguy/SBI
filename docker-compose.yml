name: sbi

services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_USER: sbi
      MARIADB_PASSWORD: sbi
      MARIADB_DATABASE: sbi
      MARIADB_ROOT_PASSWORD: sbi-root
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./infra/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - storage-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  mariadb-data:
  storage-data:
