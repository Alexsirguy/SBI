          $("#lab-speed").textContent = `${((ratio * 2.1 * cadence * 60) / 1000).toFixed(1)} km/h`;
          const bar = $("#lab-effort");
          bar.style.width = `${Math.min(100, Math.round((ratio / 4.7) * 100))}%`;
          bar.textContent = ratio < 1.2 ? "Gentle" : ratio < 2.4 ? "Medium" : "Hard";
          $("canvas").setAttribute(
            "aria-label",
            `3D bike gears: front ring ${front} teeth, back cog ${back} teeth. One pedal turn turns the wheel ${ratio.toFixed(2)} times.`,
          );
        }
        function counts() {
          const { front, back } = values();
          const pedal = crank / (Math.PI * 2);
          $("#lab-count").textContent =
            `${pedal.toFixed(1)} pedal turns, ${((pedal * front) / back).toFixed(1)} wheel turns`;
        }

        let model = null;
        let three = null;
        function rebuild() {
          if (!three) return;
          const { front, back } = values();
          if (model) {
            three.scene.remove(model.group);
            model.dispose();
          }
          model = buildDrivetrain(three.THREE, front, back);
          three.scene.add(model.group);
          crank = 0;
        }

        const onChange = () => {
          log("labChange", values());
          rebuild();
          counts();
        };
        Object.values(inputs).forEach((input) => {
          input.addEventListener("input", readouts);
          input.addEventListener("change", onChange);
        });
        stage.querySelectorAll("[data-preset]").forEach((button) =>
          button.addEventListener("click", () => {
            const [front, back] = button.dataset.preset.split(",");
            inputs.front.value = front;
            inputs.back.value = back;
            readouts();
            onChange();
          }),
        );
        $("#lab-once").addEventListener("click", () => {
          log("labTurnOnce", values());
          crank = 0;
          target = Math.PI * 2;
          running = false;
          if (reducedMotion()) {
            crank = target;
            target = null;
          }
          counts();
        });
        $("#lab-run").addEventListener("click", () => {
          log("labRun", values());
          target = null;
          running = true;
        });
        readouts();
        counts();

        loadThree()
          .then(({ THREE, OrbitControls }) => {
            if (stopped) return;
            three = { THREE, ...labScene(THREE, OrbitControls, $("canvas")) };
            rebuild();
            let first = true;
            let last = performance.now();
            const frame = (now) => {
              if (stopped) {
                model?.dispose();
                return three.renderer.dispose();
              }
              const dt = Math.min(0.05, (now - last) / 1000);
              last = now;
              const { front, back, cadence } = values();
              const speed = (cadence / 60) * Math.PI * 2;
              if (target !== null) {
                crank = Math.min(target, crank + dt * speed);
                if (crank >= target) target = null;
                counts();
              } else if (running) {
                crank += dt * speed;
                counts();
              }
              // Clockwise from the drive side; the cog turns front ÷ back times as fast.
              model.ring.rotation.z = -crank;
              model.cog.rotation.z = (-crank * front) / back;
              model.wheel.rotation.z = (-crank * front) / back;
              model.placeLinks(crank * model.radius);
              three.controls.update();
              three.renderer.render(three.scene, three.camera);
              if (first) {
                first = false;
                visualReady("lab", started);
              }
              requestAnimationFrame(frame);
            };
            requestAnimationFrame(frame);
          })
          .catch((error) => {
            log("error", { where: "lab", message: String(error.message).slice(0, 120) });
            $("canvas").replaceWith(
              Object.assign(document.createElement("p"), {
                className: "notice",
                textContent:
                  "The 3D view couldn't load on this device, but the numbers below still work.",
              }),
            );
            visualReady("lab", started, "3D failed. ");
          });
      }

      // First demo kit; #88 replaces it with tested simulations in @sbi/visuals, and #96 lets the tutor pick them.
      const KIT = {
        gears: {
          title: "Try the gears yourself",
          lede: "Change the teeth and watch how far the back wheel turns for each turn of the pedals.",
          assumptions: "Simplified: the chain never slips, and the wheel goes 2.1 m per turn.",
          mount: (stage, started) => mountGearLab(stage, started),
        },
        engine: {
          title: "Run the engine yourself",
          lede: "Step through the four strokes and see which one pushes the car.",
          assumptions:
            "Simplified: one cylinder of a four-stroke petrol engine, slowed down 40 times. Power is shown relative to full throttle at 6,000 rpm.",
          mount: (stage, started) => mountEngineLab(stage, started),
        },
        lever: {
          title: "Try the lever yourself",
          lede: "Move the load and your hand, and see how hard you have to push.",
          assumptions: "Simplified: a stiff, weightless bar with no friction, and g = 9.8 m/s².",
          mount: (stage, started) => mountLeverLab(stage, started),
        },
        heating: {
          title: "Heat the water yourself",
          lede: "Change the heater, the water and how high up you are, and watch the temperature.",
          assumptions:
            "Simplified: no heat is lost, and the water starts at 20 °C. Water takes 4.19 kJ per kg per °C to warm and 2,260 kJ per kg to boil. Air pressure halves about every 5.8 km of height. Time runs 20 times faster.",
          mount: (stage, started) => mountHeatingLab(stage, started),
        },
      };
      const KIT_NAMES = Object.keys(KIT);

      SCREENS.lab = () => {
        const kit = KIT[state.labTemplate] ?? KIT.gears;
        return `
        ${backButton("lesson", "Back to the lesson")}
        <p class="topic-chip">${esc(currentTopic().label)}</p>
        <h2>${kit.title}</h2>
        <p class="lede">${kit.lede}</p>
        <div class="visual" id="visual-stage" data-format="lab"></div>
        <p class="hint" id="visual-status" aria-live="polite">Loading…</p>
        <p class="hint">${kit.assumptions}</p>`;
      };

      function mountLab(stage, started) {
        (KIT[state.labTemplate] ?? KIT.gears).mount(stage, started);
      }

      function slider(id, label, unit, min, max, step, value) {
        return `<label class="field"><span>${label}: <output id="${id}">${value}</output> ${unit}</span>
          <input type="range" min="${min}" max="${max}" step="${step}" value="${value}" id="${id}-input" /></label>`;
      }

      // Shared plumbing: reads sliders, logs settled changes, and runs a frame loop until the screen changes.
      function labPlumbing(stage, ids, onInput) {
        const $ = (selector) => stage.querySelector(selector);
        const values = () =>
          Object.fromEntries(ids.map((id) => [id, Number($(`#${id}-input`).value)]));
        const show = () => {
          for (const id of ids) $(`#${id}`).textContent = $(`#${id}-input`).value;
          onInput(values());
        };
        for (const id of ids) {
          $(`#${id}-input`).addEventListener("input", show);
          $(`#${id}-input`).addEventListener("change", () =>
            log("labChange", { template: state.labTemplate, ...values() }),
          );
        }
        let stopped = false;
        state.cleanup = () => {
          stopped = true;
        };
        const loop = (draw) => {
          let last = performance.now();
          const frame = (now) => {
            if (stopped) return;
            draw(Math.min(0.05, (now - last) / 1000));
            last = now;
            requestAnimationFrame(frame);
          };
          requestAnimationFrame(frame);
        };
        return { $, values, show, loop };
      }

      const token = (name) =>
        getComputedStyle(document.documentElement).getPropertyValue(name).trim();

      const STROKES = [
        ["Intake", "The piston moves down and pulls in fuel and air."],
        ["Compression", "The piston moves up and squeezes the fuel and air."],
        [
          "Power",
          "The spark lights the fuel. Hot gas shoves the piston down. This is the only push.",
        ],
        ["Exhaust", "The piston moves up and pushes the burnt gas out."],
      ];

      function mountEngineLab(stage, started) {
        stage.innerHTML = `
          <canvas width="640" height="420" role="img" aria-label="Engine cylinder"></canvas>
          <div class="sim-controls">
            ${slider("eng-rpm", "Engine speed", "turns a minute (rpm)", 600, 6000, 100, 1800)}
            ${slider("eng-throttle", "Accelerator", "%", 10, 100, 5, 50)}
          </div>
          <div class="row">
            <button class="btn" type="button" id="eng-step">Next stroke</button>
            <button class="btn secondary" type="button" id="eng-run">Keep running</button>
          </div>
          <dl class="compare sim-readout" aria-live="polite">
            <div><dt>Now</dt><dd id="eng-stroke"></dd></div>
            <div><dt>Pushes per minute</dt><dd id="eng-pushes"></dd></div>
            <div><dt>Power</dt><dd><span class="effort"><span id="eng-power"></span></span></dd></div>
          </dl>`;
        const canvas = stage.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        // Crank angle runs 0 to 4π over the four strokes; 0 is the piston at the top.
        let angle = 0;
        let target = null;
        let running = !reducedMotion();
        let shownStroke = -1;
        const { $, values, show, loop } = labPlumbing(stage, ["eng-rpm", "eng-throttle"], (v) => {
          $("#eng-pushes").textContent =
            `${Math.round(v["eng-rpm"] / 2).toLocaleString()} (one every 2 turns)`;
          const power = Math.round((v["eng-throttle"] / 100) * (v["eng-rpm"] / 6000) * 100);
          const bar = $("#eng-power");
          bar.style.width = `${Math.max(power, 8)}%`;
          bar.textContent = `${power}%`;
        });
        const strokeOf = (a) =>
          Math.floor((((a % (4 * Math.PI)) + 4 * Math.PI) % (4 * Math.PI)) / Math.PI);
        const announce = () => {
          const stroke = strokeOf(angle + 1e-6);
          if (stroke === shownStroke) return;
          shownStroke = stroke;
          const [name, text] = STROKES[stroke];
          $("#eng-stroke").textContent = `${stroke + 1}. ${name}: ${text}`;
          canvas.setAttribute(
            "aria-label",
            `Engine cylinder, ${name.toLowerCase()} stroke. ${text}`,
          );
        };
        $("#eng-step").addEventListener("click", () => {
          running = false;
          target = (Math.floor(angle / Math.PI + 1e-6) + 1) * Math.PI;
          if (reducedMotion()) {
            angle = target;
            target = null;
          }
          log("labStep", { template: "engine", stroke: strokeOf(angle) });
        });
        $("#eng-run").addEventListener("click", () => {
          target = null;
          running = true;
          log("labRun", { template: "engine" });
        });

        function draw() {
          const ink = token("--ink");
          const action = token("--action");
          const paper = token("--paper");
          const { "eng-throttle": throttle } = values();
          const w = canvas.width;
          ctx.clearRect(0, 0, w, canvas.height);
          const cx = w / 2;
          const crankY = 330;
          const r = 55;
          const rod = 150;
          const pistonH = 50;
          const boreTop = 90;
          const stroke = strokeOf(angle + 1e-6);
          const within = (angle % Math.PI) / Math.PI;
          // Slider-crank geometry: distance from crank centre to the piston pin.
          const pin = r * Math.cos(angle) + Math.sqrt(rod * rod - (r * Math.sin(angle)) ** 2);
          const pistonY = crankY - pin - pistonH / 2;
          const gas = [
            "rgba(80, 160, 230, 0.45)",
            "rgba(40, 110, 200, 0.65)",
            `rgba(240, 130, 30, ${0.35 + 0.6 * (throttle / 100) * (1 - within)})`,
            "rgba(130, 130, 130, 0.5)",
          ][stroke];
          ctx.fillStyle = gas;
          ctx.fillRect(cx - 70, boreTop, 140, pistonY - boreTop);
          ctx.strokeStyle = ink;
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(cx - 74, boreTop - 10);
          ctx.lineTo(cx - 74, crankY - r - 40);
          ctx.moveTo(cx + 74, boreTop - 10);
          ctx.lineTo(cx + 74, crankY - r - 40);
          ctx.moveTo(cx - 74, boreTop - 10);
          ctx.lineTo(cx + 74, boreTop - 10);
          ctx.stroke();
          const valve = (x, open, label) => {
            ctx.fillStyle = ink;
            ctx.fillRect(x - 3, boreTop - 50, 6, 40 + (open ? 16 : 0));
            ctx.fillRect(x - 18, boreTop - 12 + (open ? 16 : 0), 36, 6);
            // The canvas is shown at about half size on phones, so text is drawn large.
            ctx.font = `600 24px ${token("--body") || "sans-serif"}`;
            ctx.textAlign = x < cx ? "right" : "left";
            ctx.fillText(label, x + (x < cx ? -30 : 30), boreTop - 30);
          };
          valve(cx - 40, stroke === 0, "Fuel + air in");
          valve(cx + 40, stroke === 3, "Exhaust out");
          ctx.fillStyle = ink;
          ctx.fillRect(cx - 4, boreTop - 48, 8, 30);
          if (stroke === 2 && within < 0.15) {
            ctx.fillStyle = token("--highlight");
            ctx.beginPath();
            ctx.arc(cx, boreTop - 2, 14, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = action;
          ctx.fillRect(cx - 68, pistonY, 136, pistonH);
          const crankX = cx + r * Math.sin(angle);
          const crankPinY = crankY - r * Math.cos(angle);
          ctx.strokeStyle = ink;
          ctx.lineWidth = 10;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(cx, pistonY + pistonH / 2);
          ctx.lineTo(crankX, crankPinY);
          ctx.stroke();
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(cx, crankY, r + 14, 0, Math.PI * 2);
          ctx.stroke();
          ctx.lineWidth = 12;
          ctx.beginPath();
          ctx.moveTo(cx, crankY);
          ctx.lineTo(crankX, crankPinY);
          ctx.stroke();
          ctx.fillStyle = paper;
          ctx.beginPath();
          ctx.arc(cx, crankY, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = ink;
          ctx.textAlign = "left";
          ctx.fillText("Crankshaft", cx + r + 26, crankY - 6);
          ctx.fillText("turns the wheels", cx + r + 26, crankY + 22);
          ctx.font = `700 30px ${token("--body") || "sans-serif"}`;
          ctx.fillText(STROKES[stroke][0], cx + 90, boreTop + 60);
        }

        show();
        announce();
        loop((dt) => {
          // Slowed 40 times so each stroke can be followed by eye.
          const speed = (values()["eng-rpm"] / 60 / 40) * Math.PI * 2;
          if (target !== null) {
            angle = Math.min(target, angle + dt * Math.max(speed, Math.PI));
            if (angle >= target) target = null;
          } else if (running) angle += dt * speed;
          announce();
          draw();
        });
        requestAnimationFrame(() => visualReady("engine", started));
      }

      function mountLeverLab(stage, started) {
        stage.innerHTML = `
          <canvas width="640" height="300" role="img" aria-label="Lever"></canvas>
          <div class="sim-controls">
            ${slider("lev-load", "Load", "kg", 5, 100, 5, 40)}
            ${slider("lev-dl", "Load to pivot", "m", 0.2, 2, 0.1, 0.5)}
            ${slider("lev-de", "Your hand to pivot", "m", 0.2, 2, 0.1, 1.5)}
          </div>
          <button class="btn" type="button" id="lev-lift">Lift the load 10 cm</button>
          <dl class="compare sim-readout" aria-live="polite">
            <div><dt>Push you need</dt><dd id="lev-force"></dd></div>
            <div><dt>When the load rises 10 cm</dt><dd id="lev-move"></dd></div>
            <div><dt>Work done</dt><dd id="lev-work"></dd></div>
          </dl>`;
        const canvas = stage.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        let tilt = 0;
        let lifting = false;
        const maths = (v) => {
          const force = (v["lev-load"] * 9.8 * v["lev-dl"]) / v["lev-de"];
          return { force, hand: (10 * v["lev-de"]) / v["lev-dl"] };
        };
        const { $, values, show, loop } = labPlumbing(
          stage,
          ["lev-load", "lev-dl", "lev-de"],
          (v) => {
            const { force, hand } = maths(v);
            $("#lev-force").textContent =
              `${Math.round(force)} N, like lifting ${(force / 9.8).toFixed(1)} kg`;
            $("#lev-move").textContent = `your hand moves ${hand.toFixed(0)} cm`;
            const work = v["lev-load"] * 9.8 * 0.1;
            $("#lev-work").textContent =
              `${work.toFixed(1)} J on the load, ${((force * hand) / 100).toFixed(1)} J from you: the same`;
            canvas.setAttribute(
              "aria-label",
              `Lever: ${v["lev-load"]} kg load ${v["lev-dl"]} m from the pivot, hand ${v["lev-de"]} m from the pivot. Push needed ${Math.round(force)} newtons.`,
            );
          },
        );
        $("#lev-lift").addEventListener("click", () => {
          lifting = true;
          tilt = 0;
          if (reducedMotion()) {
            tilt = 1;
            lifting = false;
          }
          log("labLift", { template: "lever", ...values() });
        });

        function draw() {
          const v = values();
          const { force } = maths(v);
          const ink = token("--ink");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const px = 320;
          const py = 200;
          const scale = 140;
          // The tilt is exaggerated so it shows, but capped so the hand end stays above the ground.
          const angle = -tilt * Math.min(0.25, Math.asin(Math.min(1, 36 / (v["lev-de"] * scale))));
          const end = (d) => ({
            x: px + d * scale * Math.cos(angle),
            y: py - d * scale * Math.sin(angle),
          });
          const load = end(-v["lev-dl"]);
          const hand = end(v["lev-de"]);
          ctx.fillStyle = ink;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px - 22, py + 40);
          ctx.lineTo(px + 22, py + 40);
          ctx.closePath();
          ctx.fill();
          ctx.fillRect(0, py + 40, canvas.width, 4);
          ctx.strokeStyle = token("--action");
          ctx.lineWidth = 10;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(load.x, load.y);
          ctx.lineTo(hand.x, hand.y);
          ctx.stroke();
          const box = 18 + v["lev-load"] * 0.45;
          ctx.fillStyle = token("--highlight");
          ctx.fillRect(load.x - box / 2, load.y - box - 5, box, box);
          ctx.fillStyle = ink;
          ctx.font = `600 22px ${token("--body") || "sans-serif"}`;
          ctx.textAlign = "center";
          ctx.fillText(`${v["lev-load"]} kg`, load.x, load.y - box - 14);
          const arrow = Math.min(150, 20 + force / 6);
          ctx.strokeStyle = ink;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(hand.x, hand.y - arrow - 8);
          ctx.lineTo(hand.x, hand.y - 8);
          ctx.lineTo(hand.x - 9, hand.y - 20);
          ctx.moveTo(hand.x, hand.y - 8);
          ctx.lineTo(hand.x + 9, hand.y - 20);
          ctx.stroke();
          ctx.fillText(`push ${Math.round(force)} N`, hand.x, hand.y - arrow - 16);
          ctx.fillText("pivot", px, py + 62);
        }

        show();
        loop((dt) => {
          if (lifting) {
            tilt = Math.min(1, tilt + dt * 0.8);
            if (tilt >= 1) lifting = false;
          }
          draw();
        });
        requestAnimationFrame(() => visualReady("lever", started));
      }

      // Boiling point from pressure (Clausius–Clapeyron), with pressure falling exponentially with height.
      function boilingPointC(heightKm) {
        const pressureAtm = Math.exp(-heightKm / 8.4);
        return 1 / (1 / 373.15 - (8.314 / 40660) * Math.log(pressureAtm)) - 273.15;
      }

      function mountHeatingLab(stage, started) {
        stage.innerHTML = `
          <canvas width="640" height="320" role="img" aria-label="Water heating"></canvas>
          <div class="sim-controls">
            ${slider("heat-power", "Heater", "W", 500, 3000, 100, 2000)}
            ${slider("heat-water", "Water", "litres", 0.25, 2, 0.25, 1)}
            ${slider("heat-height", "Height above the sea", "km", 0, 8.8, 0.2, 0)}
          </div>
          <div class="row">
            <button class="btn" type="button" id="heat-go">Start heating</button>
            <button class="btn secondary" type="button" id="heat-reset">Start again</button>
          </div>
          <dl class="compare sim-readout" aria-live="polite">
            <div><dt>Water temperature</dt><dd id="heat-temp"></dd></div>
            <div><dt>Boils here at</dt><dd id="heat-bp"></dd></div>
            <div><dt>Time to boil</dt><dd id="heat-time"></dd></div>
            <div><dt>Water left</dt><dd id="heat-left"></dd></div>
          </dl>`;
        const canvas = stage.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        let temp = 20;
        let mass = 1;
        let seconds = 0;
        let heating = false;
        let history = [];
        const particles = Array.from({ length: 36 }, () => ({
          x: Math.random(),
          y: Math.random(),
          a: Math.random() * Math.PI * 2,
        }));
        const bubbles = [];
        const reset = () => {
          temp = 20;
          mass = values()["heat-water"];
          seconds = 0;
          history = [];
          heating = false;
        };
        const { $, values, show, loop } = labPlumbing(
          stage,
          ["heat-power", "heat-water", "heat-height"],
          (v) => {
            const bp = boilingPointC(v["heat-height"]);
            $("#heat-bp").textContent = `${bp.toFixed(0)} °C`;
            const toBoil = (v["heat-water"] * 4190 * (bp - 20)) / v["heat-power"];
            $("#heat-time").textContent = `${(toBoil / 60).toFixed(1)} minutes from 20 °C`;
            if (!heating && seconds === 0) mass = v["heat-water"];
          },
        );
        $("#heat-go").addEventListener("click", () => {
          if (seconds === 0) reset();
          heating = true;
          log("labRun", { template: "heating", ...values() });
        });
        $("#heat-reset").addEventListener("click", reset);

        function step(dt) {
          if (!heating || mass <= 0) return;
          const v = values();
          const bp = boilingPointC(v["heat-height"]);
          const simDt = dt * 20;
          const energy = v["heat-power"] * simDt;
          if (temp < bp) temp = Math.min(bp, temp + energy / (mass * 4190));
          else mass = Math.max(0, mass - energy / 2.26e6);
          seconds += simDt;
          history.push([seconds, temp]);
          if (history.length > 2000) history = history.filter((_, i) => i % 2 === 0);
        }

        function draw(dt) {
          const v = values();
          const bp = boilingPointC(v["heat-height"]);
          const ink = token("--ink");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const pot = { x: 30, y: 60, w: 220, h: 200 };
          const level = pot.y + pot.h - (pot.h - 30) * Math.min(1, mass / 2);
          ctx.fillStyle = `rgba(80, 160, 230, ${0.25 + 0.5 * ((temp - 20) / 80)})`;
          ctx.fillRect(pot.x, level, pot.w, pot.y + pot.h - level);
          const speed = reducedMotion() ? 0 : 0.15 + ((temp - 20) / 80) * 1.4;
          ctx.fillStyle = ink;
          for (const p of particles) {
            p.a += (Math.random() - 0.5) * 2;
            p.x = Math.min(1, Math.max(0, p.x + Math.cos(p.a) * speed * dt));
            p.y = Math.min(1, Math.max(0, p.y + Math.sin(p.a) * speed * dt));
            ctx.beginPath();
            ctx.arc(
              pot.x + 8 + p.x * (pot.w - 16),
              level + 6 + p.y * (pot.y + pot.h - level - 12),
              3,
              0,
              Math.PI * 2,
            );
            ctx.fill();
          }
          if (heating && temp >= bp - 0.01 && mass > 0 && !reducedMotion() && Math.random() < 0.5)
            bubbles.push({
              x: pot.x + 20 + Math.random() * (pot.w - 40),
              y: pot.y + pot.h - 8,
              r: 3 + Math.random() * 6,
            });
          ctx.strokeStyle = ink;
          ctx.lineWidth = 2;
          for (const bubble of bubbles) {
            bubble.y -= 120 * dt;
            ctx.beginPath();
            ctx.arc(bubble.x, bubble.y, bubble.r, 0, Math.PI * 2);
            ctx.stroke();
          }
          while (bubbles.length && bubbles[0].y < level) bubbles.shift();
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(pot.x, pot.y);
          ctx.lineTo(pot.x, pot.y + pot.h);
          ctx.lineTo(pot.x + pot.w, pot.y + pot.h);
          ctx.lineTo(pot.x + pot.w, pot.y);
          ctx.stroke();
          ctx.fillStyle = heating ? "rgb(230, 90, 30)" : token("--rule");
          ctx.fillRect(pot.x + 10, pot.y + pot.h + 8, pot.w - 20, 10);
          const g = { x: 320, y: 40, w: 290, h: 220 };
          const maxT = 110;
          const maxS = Math.max(240, seconds * 1.1);
          const gx = (s) => g.x + (s / maxS) * g.w;
          const gy = (t) => g.y + g.h - (t / maxT) * g.h;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(g.x, g.y);
          ctx.lineTo(g.x, g.y + g.h);
          ctx.lineTo(g.x + g.w, g.y + g.h);
          ctx.stroke();
          ctx.setLineDash([5, 5]);
          ctx.strokeStyle = token("--ink-soft");
          ctx.beginPath();
          ctx.moveTo(g.x, gy(bp));
          ctx.lineTo(g.x + g.w, gy(bp));
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.strokeStyle = token("--action");
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(gx(0), gy(20));
          for (const [s, t] of history) ctx.lineTo(gx(s), gy(t));
          ctx.stroke();
          ctx.fillStyle = ink;
          ctx.font = `600 20px ${token("--body") || "sans-serif"}`;
          ctx.textAlign = "left";
          ctx.fillText(`boils at ${bp.toFixed(0)} °C`, g.x + 8, gy(bp) - 8);
          ctx.fillText("°C", g.x - 4, g.y - 10);
          ctx.textAlign = "right";
          ctx.fillText(`${(maxS / 60).toFixed(0)} min`, g.x + g.w, g.y + g.h + 20);
          $("#heat-temp").textContent =
            `${temp.toFixed(1)} °C${temp >= bp - 0.01 && heating ? ", boiling: the heat now turns water into steam" : ""}`;
          $("#heat-left").textContent = `${mass.toFixed(2)} litres`;
          canvas.setAttribute(
            "aria-label",
            `Water at ${temp.toFixed(0)} °C. It boils here at ${bp.toFixed(0)} °C.`,
          );
        }

        show();
        loop((dt) => {
          step(dt);
          draw(dt);
        });
        requestAnimationFrame(() => visualReady("heating", started));
      }

      const MOUNTS = { svg: mountSvg, glb: mountGlb, sim: mountSim, lab: mountLab };

      function renderFacilitator() {
        const dialog = document.getElementById("facilitator");
        const hasKey = Boolean(metaKey());
        dialog.innerHTML = `
          <form method="dialog" class="panel-grid" id="facilitator-form">
            <h2 id="facilitator-title">Session</h2>
            <p class="hint">For the person running the session. Learners don't need this panel.</p>
            <div class="field"><label for="f-participant">Participant code</label>
              <input id="f-participant" name="participant" value="${esc(session.participant)}" placeholder="C01" autocomplete="off" /></div>
            <div class="field"><label for="f-segment">Segment</label>
              <select id="f-segment" name="segment">
                ${["", "child 8-12", "teen", "adult", "family"]
                  .map(
                    (value) =>
                      `<option value="${value}" ${session.segment === value ? "selected" : ""}>${value || "Choose…"}</option>`,
                  )
                  .join("")}
              </select></div>
            <div class="field"><label for="f-variant">Lesson variant</label>
              <select id="f-variant" name="variant">
                ${Object.entries(VARIANTS)
                  .map(
                    ([value, label]) =>
                      `<option value="${value}" ${(session.variant ?? "A") === value ? "selected" : ""}>${label}</option>`,
                  )
                  .join("")}
              </select></div>
            <div class="field"><label for="f-visual">Visual order</label>
              <select id="f-visual" name="visualOrder">
                ${[
                  ["auto", "Auto from participant number"],
                  ...VISUAL_ORDERS.map((order) => [order.join(","), order.join(", ")]),
                ]
                  .map(
                    ([value, label]) =>
                      `<option value="${value}" ${session.visualOrder === value ? "selected" : ""}>${label}</option>`,
                  )
                  .join("")}
              </select></div>
            <div class="field"><label for="f-mode">Mode</label>
              <select id="f-mode" name="mode">
                <option value="demo" ${session.mode === "demo" ? "selected" : ""}>Demo: sample photos and prepared lessons</option>
                <option value="live" ${session.mode === "live" ? "selected" : ""}>Live: real photos via Meta Model API</option>
              </select></div>
            <div class="field"><label for="f-key">Meta Model API key</label>
              <input id="f-key" name="key" type="password" autocomplete="off" placeholder="${hasKey ? "Key saved for this tab" : "Paste key for live mode"}" />
              <span class="hint">Kept in this browser tab only and cleared when you close it. Use a Standard-mode key so content isn't used for training.</span></div>
            <div class="field"><label for="f-model">Meta model</label>
              <input id="f-model" name="model" value="${esc(session.model)}" autocomplete="off" /></div>
            <p class="hint">${session.events.length} events since ${esc(session.startedAt.slice(0, 16).replace("T", " "))}</p>
            <ul class="log" id="event-log">${session.events
              .slice(-30)
              .reverse()
              .map(
                (event) =>
                  `<li>${esc(event.type)} ${esc(JSON.stringify({ ...event, at: undefined, ms: undefined, type: undefined }))}</li>`,
              )
              .join("")}</ul>
            <div class="row">
              <button class="btn" value="save">Save</button>
              <button class="btn secondary" type="button" id="f-json">Export JSON</button>
              <button class="btn secondary" type="button" id="f-csv">Export CSV</button>
              <button class="btn quiet" type="button" id="f-new">New session</button>
            </div>
          </form>`;
        dialog.querySelector("#f-json").addEventListener("click", () => download("json"));
        dialog.querySelector("#f-csv").addEventListener("click", () => download("csv"));
        dialog.querySelector("#f-new").addEventListener("click", () => {
          if (!confirm("Start a new session? Export this one first if you need it.")) return;
          try {
            localStorage.removeItem(STORE_KEY);
          } catch {}
          session = loadSession();
          saveSession();
          renderFacilitator();
          go("home", { sample: null, photoUrl: null, recognition: null });
        });
        dialog.querySelector("form").addEventListener("submit", () => {
          const form = dialog.querySelector("form");
          Object.assign(session, {
            participant: form.participant.value.trim(),
            segment: form.segment.value,
            mode: form.mode.value,
            variant: form.variant.value,
            visualOrder: form.visualOrder.value,
            model: form.model.value.trim() || "muse-spark-1.3",
          });
          if (form.key.value.trim()) {
            try {
              sessionStorage.setItem(KEY_KEY, form.key.value.trim());
            } catch {}
          }
          log("session", {
            participant: session.participant,
            segment: session.segment,
            mode: session.mode,
          });
          render();
        });
      }

      function download(kind) {
        const name = `sbi-session-${session.participant || "anon"}-${session.startedAt.slice(0, 10)}`;
        let body;
        if (kind === "json") {
          const { events, ...meta } = session;
          body = JSON.stringify({ ...meta, events }, null, 2);
        } else {
          const columns = ["at", "ms", "screen", "type", "data"];
          const rows = session.events.map((event) => {
            const { at, ms, screen, type, ...data } = event;
            return [at, ms, screen, type, JSON.stringify(data)]
              .map((cell) => `"${String(cell).replace(/"/g, '""')}"`)
              .join(",");
          });
          body = [columns.join(","), ...rows].join("\n");
        }
        const url = URL.createObjectURL(
          new Blob([body], { type: kind === "json" ? "application/json" : "text/csv" }),
        );
        const link = Object.assign(document.createElement("a"), {
          href: url,
          download: `${name}.${kind}`,
        });
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        log("export", { kind });
      }

      if (FACILITATOR) {
        const toggle = document.getElementById("facilitator-toggle");
        toggle.hidden = false;
        toggle.addEventListener("click", () => {
          renderFacilitator();
          document.getElementById("facilitator").showModal();
        });
      }

      render();
      log("open", { facilitator: FACILITATOR });
    </script>
  </body>
</html>
