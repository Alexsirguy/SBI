      content="Prototype: photograph an everyday object and learn the science behind it."

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />
    <style>
      :root {
        --bench: #eef2f1;
        --paper: #ffffff;
        --ink: #14263a;
        --ink-soft: #4f6172;
        --rule: #c9d3d6;
        --action: #0d6b67;
        --action-ink: #ffffff;
        --highlight: #ffd23f;
        --caution: #a8321f;
        --tag: #f7e7b4;
        --focus: #1f5fd1;
        --radius-s: 6px;
        --radius-l: 18px;
        --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
        --display: "Bricolage Grotesque", "Atkinson Hyperlegible Next", system-ui, sans-serif;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bench: #0f1a24;
          --paper: #17242f;
          --ink: #e8eef2;
          --ink-soft: #a9b8c4;
          --rule: #2f4150;
          --action: #4cc2b8;
          --action-ink: #06201e;
          --highlight: #e8bd2c;
          --caution: #ff8a73;
          --tag: #3a3418;
          --focus: #8fb4ff;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bench: #0f1a24;
        --paper: #17242f;
        --ink: #e8eef2;
        --ink-soft: #a9b8c4;
        --rule: #2f4150;
        --action: #4cc2b8;
        --action-ink: #06201e;
        --highlight: #e8bd2c;
        --caution: #ff8a73;
        --tag: #3a3418;
        --focus: #8fb4ff;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bench);
        color: var(--ink);
        font: 400 1.0625rem/1.55 var(--body);
        min-height: 100dvh;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.25rem 1rem 6rem;
      }
      h1,
      h2,
      h3 {
        font-family: var(--display);
        line-height: 1.1;
        margin: 0 0 0.5rem;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: clamp(2rem, 7vw, 2.75rem);
        font-weight: 800;
      }
      h2 {
        font-size: 1.5rem;
        font-weight: 600;
      }
      h3 {
        font-size: 1.15rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1rem;
        max-width: 34rem;
      }
      a {
        color: var(--action);
      }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .lede {
        color: var(--ink-soft);
        font-size: 1.125rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 3rem;
        padding: 0.75rem 1.25rem;
        border-radius: 999px;
        border: 2px solid var(--action);
        background: var(--action);
        color: var(--action-ink);
        font: 600 1.0625rem/1 var(--body);
        cursor: pointer;
        text-decoration: none;
      }
      .btn.secondary {
        background: transparent;
        color: var(--action);
      }
      .btn.quiet {
        border-color: transparent;
        background: transparent;
        color: var(--ink-soft);
        text-decoration: underline;
        padding-inline: 0.25rem;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: flex-start;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }
      .back {
        margin-bottom: 1rem;
      }

      .samples {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
        margin: 1rem 0 1.5rem;
        padding: 0;
        list-style: none;
      }
      .sample {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        padding: 0.5rem 0.5rem 0.65rem;
        border: 1px solid var(--rule);
        border-radius: var(--radius-s);
        background: var(--paper);
        color: var(--ink);
        font: 600 0.95rem/1.2 var(--body);
        text-align: left;
        cursor: pointer;
      }
      .sample svg,
      .photo svg,
      .photo img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 4px;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }
      .capture {
        position: relative;
        overflow: hidden;
      }
      .capture input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      .photo {
        position: relative;
        border-radius: var(--radius-l);
        overflow: hidden;
        background: var(--paper);
        border: 1px solid var(--rule);
      }
      .scanline {
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--highlight);
        box-shadow: 0 0 18px 6px color-mix(in srgb, var(--highlight) 55%, transparent);
        animation: scan 1.4s ease-in-out infinite alternate;
      }
      @keyframes scan {
        from {
          top: 4%;
        }
        to {
          top: 94%;
        }
      }

      .tag {
        position: relative;
        margin: -1.75rem 0 1.25rem 1.25rem;
        width: min(19rem, 85%);
        padding: 0.85rem 1rem 0.9rem 1.6rem;
        background: var(--tag);
        color: var(--ink);
        border-radius: 4px 14px 14px 4px;
        clip-path: polygon(0.9rem 0, 100% 0, 100% 100%, 0.9rem 100%, 0 50%);
        transform: rotate(-2deg);
        box-shadow: 0 2px 0 var(--rule);
      }
      .tag::before {
        content: "";
        position: absolute;
        left: 0.75rem;
        top: 50%;
        width: 0.55rem;
        height: 0.55rem;
        margin-top: -0.275rem;
        border-radius: 50%;
        background: var(--bench);
        box-shadow: inset 0 0 0 2px var(--ink-soft);
      }
      .tag .label {
        font: 800 1.6rem/1.05 var(--display);
        display: block;
      }
      .tag .certainty {
        font-size: 0.95rem;
        color: var(--ink-soft);
      }
      .choices {
        list-style: none;
        padding: 0;
        margin: 0 0 1rem;
        display: grid;
        gap: 0.5rem;
        width: 100%;
      }
      .choice {
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1rem;
        border-radius: var(--radius-s);
        border: 1px solid var(--rule);
        background: var(--paper);
        color: var(--ink);
        font: 600 1.05rem/1.3 var(--body);
        text-align: left;
        cursor: pointer;
      }
      .choice small {
        font-weight: 400;
        color: var(--ink-soft);
      }
      .field {
        display: grid;
        gap: 0.35rem;
        width: 100%;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        min-height: 2.75rem;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--ink-soft);
        border-radius: var(--radius-s);
        background: var(--paper);
        color: var(--ink);
        font: inherit;
      }
      .hint {
        font-size: 0.9rem;
        color: var(--ink-soft);
      }
      .notice {
        border-left: 4px solid var(--caution);
        padding: 0.75rem 1rem;
        background: var(--paper);
        border-radius: 0 var(--radius-s) var(--radius-s) 0;
        margin-bottom: 1rem;
      }

      .facilitator-toggle {
        position: fixed;
        right: 1rem;
        bottom: calc(1rem + env(safe-area-inset-bottom));
        z-index: 10;
        box-shadow: 0 2px 0 var(--rule);
      }
      dialog {
        width: min(36rem, calc(100vw - 2rem));
        max-height: calc(100dvh - 2rem);
        border: 1px solid var(--rule);
        border-radius: var(--radius-l);
        background: var(--paper);
        color: var(--ink);
        padding: 1.25rem;
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.45);
      }
      .panel-grid {
        display: grid;
        gap: 0.85rem;
      }
      .log {
        max-height: 10rem;
        overflow: auto;
        font-size: 0.85rem;
        color: var(--ink-soft);
        border: 1px solid var(--rule);
        border-radius: var(--radius-s);
        padding: 0.5rem;
        margin: 0;
        list-style: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      .options {
        border: 0;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.5rem;
        width: 100%;
      }
      .option {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 0.85rem 1rem;
        border: 1px solid var(--rule);
        border-radius: var(--radius-s);
        background: var(--paper);
        cursor: pointer;
        font-weight: 600;
      }
      .option input {
        width: 1.25rem;
        height: 1.25rem;
        accent-color: var(--action);
        flex: none;
      }
      .option:has(input:checked) {
        border-color: var(--action);
        box-shadow: inset 0 0 0 1px var(--action);
      }
      .topic-chip {
        display: inline-block;
        margin: 0 0 0.5rem;
        padding: 0.15rem 0.6rem 0.2rem;
        background: var(--tag);
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .depth {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.25rem;
        border: 0;
        padding: 0;
        margin: 0.25rem 0 1.5rem;
      }
      .depth legend {
        float: left;
        margin-right: 0.5rem;
        color: var(--ink-soft);
        font-size: 0.95rem;
      }
      .depth label {
        position: relative;
      }
      .depth input {
        position: absolute;
        opacity: 0;
        inset: 0;
      }
      .depth span {
        display: block;
        padding: 0.45rem 0.9rem;
        border: 1px solid var(--rule);
        border-radius: 999px;
        background: var(--paper);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .depth input:checked + span {
        background: var(--ink);
        color: var(--bench);
        border-color: var(--ink);
      }
      .depth input:focus-visible + span {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      /* The depth rail: a line that fills as the learner goes deeper, with unopened parts left hollow. */
      .rail {
        list-style: none;
        margin: 0 0 1.25rem;
        padding: 0 0 0 1.75rem;
        position: relative;
      }
      .module {
        position: relative;
        padding: 0 0 1.5rem;
      }
      .module::before {
        content: "";
        position: absolute;
        left: -1.75rem;
        top: 0.15rem;
        width: 0.9rem;
        height: 0.9rem;
        margin-left: 0.05rem;
        border-radius: 50%;
        background: var(--action);
        box-shadow: 0 0 0 3px var(--bench);
        z-index: 1;
      }
      .module::after {
        content: "";
        position: absolute;
        left: calc(-1.75rem + 0.45rem);
        top: 0.5rem;
        bottom: -0.5rem;
        width: 3px;
        background: var(--action);
      }
      .module:last-child::after {
        display: none;
      }
      .module.ghost {
        padding-bottom: 0.9rem;
        color: var(--ink-soft);
        opacity: 0.75;
      }
      .module.ghost::before {
        background: var(--bench);
        box-shadow:
          inset 0 0 0 2px var(--rule),
          0 0 0 3px var(--bench);
      }
      .module.ghost::after {
        background: var(--rule);
      }
      .module:not(.ghost):has(+ .ghost)::after {
        background: linear-gradient(var(--action), var(--rule));
      }
      .module h3 {
        margin-bottom: 0.35rem;
      }
      .module.answer > p:first-of-type {
        font-size: 1.2rem;
        line-height: 1.5;
      }
      mark {
        background: linear-gradient(
          transparent 12%,
          var(--highlight) 12%,
          var(--highlight) 88%,
          transparent 88%
        );
        color: var(--ink);
        padding: 0 0.1em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      details {
        margin: 0 0 0.75rem;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        color: var(--action);
      }
      .sources {
        font-size: 0.9rem;
        color: var(--ink-soft);
        margin: 0.25rem 0 0;
      }
      .lesson-actions {
        position: sticky;
        bottom: 0;
        padding: 0.75rem 0 calc(0.75rem + env(safe-area-inset-bottom));
        background: linear-gradient(transparent, var(--bench) 30%);
      }
      .compare {
        display: grid;
        gap: 0.5rem;
        margin: 0 0 1rem;
      }
      .compare div {
        padding: 0.75rem 1rem;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: var(--radius-s);
      }
      .compare dt {
        color: var(--ink-soft);
        font-size: 0.9rem;
      }
      .compare dd {
        margin: 0;
        font-weight: 600;
      }
      .visual {
        border-radius: var(--radius-l);
        border: 1px solid var(--rule);
        background: var(--paper);
        padding: 0.75rem;
        margin-bottom: 0.5rem;
      }
      .visual svg,
      .visual canvas {
        display: block;
        width: 100%;
        height: auto;
        touch-action: pan-y;
      }
      .visual .legend {
        margin: 0.5rem 0 0;
      }
      .sim-controls {
        display: grid;
        gap: 0.75rem;
        margin: 0.75rem 0;
      }
      .sim-controls input[type="range"] {
        min-height: 2.75rem;
        padding: 0;
        border: 0;
        accent-color: var(--action);
      }
      .effort {
        display: block;
        height: 1.6rem;
        border-radius: 999px;
        background: var(--bench);
        overflow: hidden;
      }
      .effort span {
        display: block;
        height: 100%;
        min-width: 4rem;
        padding: 0 0.6rem;
        background: var(--ink);
        color: var(--bench);
        font-size: 0.85rem;
        line-height: 1.6rem;
      }
      .compare small {
        font-weight: 400;
        color: var(--ink-soft);
      }
      @media (min-width: 36rem) {
        .samples {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main id="app" tabindex="-1"></main>
    <p id="status" class="sr-only" aria-live="polite"></p>
    <button id="facilitator-toggle" class="btn secondary facilitator-toggle" type="button" hidden>
      Session
    </button>
    <dialog id="facilitator" aria-labelledby="facilitator-title"></dialog>

            el.addEventListener("change", (event) => ACTIONS[el.dataset.change](el, event)),
          );
        const stage = document.getElementById("visual-stage");
        if (stage) MOUNTS[stage.dataset.format](stage, performance.now());
      }

      const backButton = (to, label = "Back") =>
        `<button class="btn quiet back" type="button" data-action="back" data-to="${to}">${label}</button>`;

      function photoMarkup() {
        if (state.photoUrl) return `<img src="${state.photoUrl}" alt="Your photo" />`;
        return ART[state.sample?.id] ?? "";
      }

      SCREENS.home = () => `
        <h1>What's the science behind it?</h1>
        <p class="lede">Take a photo of something near you. We'll work out what it is, then show you how it works.</p>
        <div class="stack">
          <label class="btn capture">
            Take a photo
            <input type="file" accept="image/*" capture="environment" data-change="photo" />
          </label>
          ${
            session.mode === "live" && metaKey()
              ? `<p class="hint">Live mode: your photo is sent to Meta's model to recognise it, and isn't saved here.</p>`
              : `<p class="hint">In this demo, pick one of these photos to try it.</p>`
          }
        </div>
        <h2>Try a sample photo</h2>
        <ul class="samples">
          ${DEMO.samples
            .map(
              (
                sample,
              ) => `<li><button class="sample" type="button" data-action="sample" data-id="${sample.id}">
                ${ART[sample.id]}<span>${esc(sample.name)}</span></button></li>`,
            )
            .join("")}
        </ul>`;

      SCREENS.looking = () => `
        <h2>Looking closely…</h2>
        <div class="photo">${photoMarkup()}<div class="scanline" aria-hidden="true"></div></div>
        <p class="hint" style="margin-top:1rem">Checking shapes, parts and materials.</p>`;

      const CERTAINTY_COPY = {
        likely: "We're fairly sure",
        possible: "This is our best guess",
        unsure: "We're not sure about this one",
      };

      SCREENS.confirm = () => {
        const result = state.recognition;
        const [top, ...rest] = result.candidates;
        if (result.status === "unsupported" || !top) return SCREENS.unsupported();
        if (result.status === "ambiguous") {
          return `
            ${backButton("home", "Try a different photo")}
            <div class="photo">${photoMarkup()}</div>
            <h2 style="margin-top:1.25rem">Which one is it?</h2>
            <p>We can see a few possibilities. Pick the one that matches.</p>
            <ul class="choices">
              ${result.candidates
                .map(
                  (
                    candidate,
                    index,
                  ) => `<li><button class="choice" type="button" data-action="pick" data-index="${index}">
                    <span>${esc(candidate.label)}</span><small>${candidate.certainty === "possible" ? "possible" : "less likely"}</small></button></li>`,
                )
                .join("")}
            </ul>
            ${somethingElse()}`;
        }
        return `
          ${backButton("home", "Try a different photo")}
          <div class="photo">${photoMarkup()}</div>
          <div class="tag" role="group" aria-label="Our guess">
            <span class="label">${esc(top.label)}</span>
            <span class="certainty">${CERTAINTY_COPY[top.certainty]}</span>
          </div>
          <h2>Is this a ${esc(top.label.toLowerCase())}?</h2>
          <div class="row" style="margin-bottom:1.25rem">
            <button class="btn" type="button" data-action="pick" data-index="0">Yes, that's it</button>
          </div>
          ${
            rest.length
              ? `<h3>Or is it…</h3><ul class="choices">${rest
                  .map(
                    (
                      candidate,
                      index,
                    ) => `<li><button class="choice" type="button" data-action="pick" data-index="${index + 1}">
                      <span>${esc(candidate.label)}</span><small>less likely</small></button></li>`,
                  )
                  .join("")}</ul>`
              : ""
          }
          ${somethingElse()}`;
      };

      function somethingElse() {
        return `
          <form class="field" data-action="correct">
            <label for="correction">Something else? Tell us what it is</label>
            <div class="row">
              <input id="correction" name="correction" maxlength="200" autocomplete="off" style="flex:1;min-width:12rem" />
              <button class="btn secondary" type="submit">Use this</button>
            </div>
          </form>`;
      }

      SCREENS.unsupported = () => `
        <div class="photo">${photoMarkup()}</div>
        <h2 style="margin-top:1.25rem">We can't explain this one</h2>
        <div class="notice"><p style="margin:0">${esc(
          state.recognition?.redirect ||
            "We couldn't tell what this is, or it's something we don't explain. Try a photo of an everyday object, close up and in good light.",
        )}</p></div>
        <button class="btn" type="button" data-action="back" data-to="home">Try another photo</button>`;

      SCREENS.nolesson = () => `
        ${backButton("home", "Try another photo")}
        <h2>We don't have that one yet</h2>
        <p>This demo has lessons for a bicycle, a kettle and a leaf. ${
          session.mode === "live"
            ? ""
            : "Turn on live mode in the session panel to try anything else."
        }</p>
        <button class="btn" type="button" data-action="back" data-to="home">Pick a sample photo</button>`;

      SCREENS.question = () => {
        const topic = DEMO.topics[state.topic];
        return `
          ${backButton("home", "Start again")}
          <h2>What do you want to know about the ${esc(topic.label.toLowerCase())}?</h2>
          <ul class="choices">
            ${topic.questions
              .map(
                (
                  question,
                  index,
                ) => `<li><button class="choice" type="button" data-action="question" data-index="${index}">
                  <span>${esc(question)}</span></button></li>`,
              )
              .join("")}
          </ul>
          ${
            topic.live
              ? `<form class="field" data-action="ownQuestion">
                  <label for="own-question">Or ask your own question</label>
                  <div class="row">
                    <input id="own-question" name="question" maxlength="200" autocomplete="off" style="flex:1;min-width:12rem" />
                    <button class="btn secondary" type="submit">Ask</button>
                  </div>
                </form>`
              : ""
          }`;
      };

      const MODULE_ORDERS = {
        A: [
          "what-youre-seeing",
          "short-answer",
          "first-principles",
          "how-parts-work",
          "try-an-idea",
          "history",
          "check-thinking",
          "go-further",
        ],
        // Variant B tests concrete-before-abstract: parts and a hands-on idea come before the big idea.
        B: [
          "what-youre-seeing",
          "short-answer",
          "how-parts-work",
          "try-an-idea",
          "first-principles",
          "check-thinking",
          "history",
          "go-further",
        ],
      };
      const MODULE_TITLES = {
        "what-youre-seeing": "What you're seeing",
        "short-answer": "The short answer",
        "first-principles": "The big idea",
        "how-parts-work": "How the parts work",
        "try-an-idea": "Try it yourself",
        history: "How we found out",
        "check-thinking": "Check your thinking",
        "go-further": "Go further",
      };
      const LEVELS = [
        ["simple", "Simply"],
        ["plain", "Normally"],
        ["technical", "In depth"],
      ];

      const currentTopic = () => DEMO.topics[state.topic];
      const moduleOrder = () => MODULE_ORDERS[session.moduleOrder] ?? MODULE_ORDERS.A;
      const levelText = (text) =>
        typeof text === "string" ? text : (text[state.level] ?? text.plain);

      function checkMarkup(kind) {
        const check = currentTopic().check;
        const before = kind === "pre";
        return `
          <h2>${before ? "Before we start: what do you think?" : "One last time: what do you think now?"}</h2>
          <p class="lede">${esc(check.question)}</p>
          <form data-action="answer" data-kind="${kind}" class="stack">
            <fieldset class="options">
              <legend class="sr-only">${esc(check.question)}</legend>
              ${check.options
                .map(
                  (
                    option,
                    index,
                  ) => `<label class="option"><input type="radio" name="choice" value="${index}" required />
                    <span>${esc(option)}</span></label>`,
                )
                .join("")}
            </fieldset>
            <button class="btn" type="submit">${before ? "Start the lesson" : "See how you did"}</button>
          </form>
          ${before ? `<p class="hint">It's fine to guess. This isn't a test of you.</p>` : ""}`;
      }

      SCREENS.precheck = () => checkMarkup("pre");
      SCREENS.postcheck = () => checkMarkup("post");

      SCREENS.writing = () => `
        <h2>Writing your lesson…</h2>
        <p class="lede">Checking facts and sources for “${esc(state.question)}”.</p>
        <div class="photo">${photoMarkup()}<div class="scanline" aria-hidden="true"></div></div>`;

      function sourcesFor(claimIds) {
        const topic = currentTopic();
        const ids = [...new Set(claimIds.flatMap((id) => topic.claims[id]?.sources ?? []))];
        if (!ids.length) return "";
        return `<p class="sources">Source${ids.length > 1 ? "s" : ""}: ${ids
          .map((id) => topic.sources[id])
          .filter(Boolean)
          .map(
            (source) =>
              `<a href="${esc(source.url)}" target="_blank" rel="noopener" data-source="${esc(source.title)}">${esc(source.title)}</a> (${esc(source.publisher)})`,
          )
          .join(", ")}</p>`;
      }

      function moduleMarkup(id, index) {
        const module = currentTopic().modules[id];
        const answer = id === "short-answer";
        return `
          <li class="module${answer ? " answer" : ""}" id="m-${id}">
            <h3>${MODULE_TITLES[id]}</h3>
            <p>${answer ? `<mark>${esc(levelText(module.text))}</mark>` : esc(levelText(module.text))}</p>
            ${
              module.reveal
                ? `<details data-reveal="${id}"><summary>Show an answer</summary><p>${esc(module.reveal)}</p></details>`
                : ""
            }
            ${
              id === "how-parts-work" && currentTopic().visual && SCREENS.visuals
                ? `<button class="btn secondary" type="button" data-action="visuals">See it in action</button>`
                : ""
            }
            ${sourcesFor(module.claims ?? [])}
          </li>`;
      }

      SCREENS.lesson = () => {
        const order = moduleOrder();
        const shown = order.slice(0, state.shown);
        const next = order[state.shown];
        return `
          ${backButton("question", "Change question")}
          <p class="topic-chip">${esc(currentTopic().label)}</p>
          <h2>${esc(state.question)}</h2>
          <fieldset class="depth">
            <legend>Explain it</legend>
            ${LEVELS.map(
              ([value, label]) =>
                `<label><input type="radio" name="level" value="${value}" data-change="level" ${
                  state.level === value ? "checked" : ""
                } /><span>${label}</span></label>`,
            ).join("")}
          </fieldset>
          <ol class="rail" aria-label="Lesson, ${state.shown} of ${order.length} parts open">
            ${shown.map(moduleMarkup).join("")}
            ${order
              .slice(state.shown)
              .map(
                (id) =>
                  `<li class="module ghost" aria-hidden="true"><span>${MODULE_TITLES[id]}</span></li>`,
              )
              .join("")}
          </ol>
          <div class="row lesson-actions">
            ${next ? `<button class="btn" type="button" data-action="deeper">Go deeper: ${MODULE_TITLES[next].toLowerCase()}</button>` : ""}
            <button class="btn ${next ? "secondary" : ""}" type="button" data-action="finish">I've got it</button>
          </div>`;
      };

      SCREENS.result = () => {
        const check = currentTopic().check;
        const mark = (choice) => (choice === check.answer ? "right" : "not quite");
        return `
          <h2>${state.post === check.answer ? "You've got it" : "Nearly there"}</h2>
          <dl class="compare">
            <div><dt>Before the lesson</dt><dd>${esc(check.options[state.pre] ?? "–")} <small>(${mark(state.pre)})</small></dd></div>
            <div><dt>After the lesson</dt><dd>${esc(check.options[state.post] ?? "–")} <small>(${mark(state.post)})</small></dd></div>
          </dl>
          <p>${esc(check.explain)}</p>
          <form class="field" data-action="explainBack">
            <label for="explain-back">Now explain it in your own words. You can say it out loud or type it here.</label>
            <textarea id="explain-back" name="text" rows="4"></textarea>
            <div class="row" style="margin-top:0.5rem">
              <button class="btn" type="submit">Done</button>
              ${currentTopic().visual && SCREENS.visuals ? `<button class="btn secondary" type="button" data-action="visuals">Compare ways of seeing it</button>` : ""}
            </div>
          </form>`;
      };

      SCREENS.done = () => `
        <h2>Thanks for trying it</h2>
        <p class="lede">What would you like to look at next?</p>
        <button class="btn" type="button" data-action="back" data-to="home">Take another photo</button>`;

      const ACTIONS = {
        back(el) {
          log("tap", { action: "back", to: el.dataset.to });
          go(
            el.dataset.to,
            el.dataset.to === "home" ? { sample: null, photoUrl: null, recognition: null } : {},
          );
        },
        sample(el) {
          const sample = DEMO.samples.find((item) => item.id === el.dataset.id);
          log("sample", { sample: sample.id, path: sample.path });
          startRecognition({ sample, recognition: sample.recognition });
        },
        async photo(el) {
          const file = el.files?.[0];
          if (!file) return;
          const photoUrl = await downscale(file);
          log("photo", { live: session.mode === "live" && Boolean(metaKey()) });
          if (session.mode === "live" && metaKey()) {
            go("looking", { sample: null, photoUrl });
            try {
              const recognition = await recogniseLive(photoUrl);
              log("recognition", {
                status: recognition.status,
                candidates: recognition.candidates.length,
              });
              go("confirm", { recognition });
            } catch (error) {
              log("error", { where: "recognition", message: String(error.message).slice(0, 120) });
              go("unsupported", {
                recognition: {
                  status: "unsupported",
                  candidates: [],
                  redirect: `Live recognition failed: ${error.message}`,
                },
              });
            }
            return;
          }
          // Demo mode cannot recognise real photos, so it shows the honest fallback.
          go("unsupported", {
            sample: null,
            photoUrl,
            recognition: {
              status: "unsupported",
              candidates: [],
              redirect:
                "This demo can only recognise the sample photos. Pick one of those to carry on.",
            },
          });
        },
        pick(el) {
          const index = Number(el.dataset.index);
          const candidate = state.recognition.candidates[index];
          log("confirm", { choice: index, label: candidate.label, certainty: candidate.certainty });
          chooseTopic(candidate.topic ?? matchTopic(candidate.label), candidate.label);
        },
        correct(form) {
          const text = form.correction.value.trim();
          if (!text) return;
          const topic = matchTopic(text);
          log("correction", { length: text.length, matched: Boolean(topic) });
          chooseTopic(topic, text);
        },
        question(el) {
          const question = currentTopic().questions[Number(el.dataset.index)];
          log("question", { index: Number(el.dataset.index) });
          startLesson(question);
        },
        ownQuestion(form) {
          const question = form.question.value.trim();
          if (!question) return;
          log("question", { own: true, length: question.length });
          startLesson(question);
        },
        answer(form) {
          const choice = Number(new FormData(form).get("choice"));
          const kind = form.dataset.kind;
          const correct = choice === currentTopic().check.answer;
          log(kind === "pre" ? "precheck" : "postcheck", { choice, correct });
          if (kind === "pre") {
            go("lesson", { pre: choice, shown: 2, lessonStartedAt: performance.now() });
          } else {
            go("result", { post: choice });
          }
        },
        level(el) {
          state.level = el.value;
          log("depth", { level: el.value, shown: state.shown });
          render();
          app.querySelector(`input[value="${el.value}"]`)?.focus();
        },
        deeper() {
          const id = moduleOrder()[state.shown];
          state.shown += 1;
          log("module", { module: id, position: state.shown, variant: session.moduleOrder });
          render();
          const heading = document.querySelector(`#m-${id} h3`);
          heading?.setAttribute("tabindex", "-1");
          heading?.focus();
          heading?.scrollIntoView({ block: "start", behavior: "smooth" });
        },
        finish() {
          log("finish", {
            shown: state.shown,
            level: state.level,
            seconds: Math.round((performance.now() - state.lessonStartedAt) / 1000),
          });
          go("postcheck");
        },
        explainBack(form) {
          log("explainBack", { length: form.text.value.trim().length });
          go("done");
        },
      };

      app.addEventListener(
        "toggle",
        (event) => {
          if (event.target.matches?.("details[data-reveal]") && event.target.open) {
            log("reveal", { module: event.target.dataset.reveal });
          }
        },
        true,
      );
      app.addEventListener("click", (event) => {
        const link = event.target.closest?.("a[data-source]");
        if (link) log("source", { title: link.dataset.source });
      });

      function defaultLevel() {
        return session.segment === "child 8-12" ? "simple" : "plain";
      }

      async function startLesson(question) {
        state.level = defaultLevel();
        if (!currentTopic().live) return go("precheck", { question });
        go("writing", { question });
        try {
          const lesson = await writeLiveLesson(currentTopic().label, question);
          if (lesson.safety.decision !== "allow") {
            log("safety", { decision: lesson.safety.decision });
            return go("unsupported", {
              recognition: {
                status: "unsupported",
                candidates: [],
                redirect: lesson.safety.learnerMessage,
              },
            });
          }
          Object.assign(currentTopic(), toTopic(lesson));
          go("precheck");
        } catch (error) {
          log("error", { where: "lesson", message: String(error.message).slice(0, 120) });
          go("unsupported", {
            recognition: {
              status: "unsupported",
              candidates: [],
              redirect: `Writing the lesson failed: ${error.message}`,
            },
          });
        }
      }

      function startRecognition(patch) {
        go("looking", { ...patch, photoUrl: null });
        const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 300 : 1600;
        setTimeout(() => {
          log("recognition", {
            status: patch.recognition.status,
            candidates: patch.recognition.candidates.length,
          });
          go("confirm");
        }, delay);
      }

      function matchTopic(label) {
        const text = label.toLowerCase();
        return Object.entries(DEMO.topics).find(([, topic]) =>
          topic.aliases.some((alias) => text.includes(alias)),
        )?.[0];
      }

      function chooseTopic(topic, label) {
        if (topic && DEMO.topics[topic]) return go("question", { topic });
        if (session.mode === "live" && metaKey()) {
          DEMO.topics.live = {
            label,
            aliases: [],
            live: true,
            questions: [
              `How does a ${label.toLowerCase()} work?`,
              "What is it made of, and why?",
              "Who invented it?",
            ],
          };
          return go("question", { topic: "live" });
        }
        go("nolesson", { requested: label });
      }

      // Mirrors LESSON_PROMPT_VERSION lesson-p0.1 in @sbi/benchmark, plus a safety gate and concept check.
      const LESSON_SYSTEM = `You write short, accurate science lessons about everyday objects for a learning app used by people aged 8 and up.
First decide safety: "allow" for normal curiosity; "redirect" or "refuse" if answering could lead to harm (eating wild plants, medicine doses, mixing chemicals, electricity, weapons) or the question isn't about science. If not "allow", leave other fields minimal and put a kind message for the learner in learnerMessage.
Write one module for each of: ${MODULE_ORDERS.A.join(", ")}. Give each module text at three levels: simple (age 8), plain (teen or adult), technical. "short-answer" answers the question in 1-2 sentences; later modules go deeper. "check-thinking" asks a question and gives the answer in reveal; reveal is null elsewhere.
Every factual statement belongs to a claim citing sourceIds; use only real, well-known reference pages whose URL you are confident exists. "history" must cite a claim.
check: one multiple-choice question about the key idea, with 3 options plus "I'm not sure" last; answer is the 0-based index of the right option; explain is one sentence.`;

      const levelsSchema = {
        type: "object",
        additionalProperties: false,
        required: ["simple", "plain", "technical"],
        properties: {
          simple: { type: "string" },
          plain: { type: "string" },
          technical: { type: "string" },
        },
      };
      const LESSON_SCHEMA = {
        type: "object",
        additionalProperties: false,
        required: ["safety", "check", "modules", "claims", "sources"],
        properties: {
          safety: {
            type: "object",
            additionalProperties: false,
            required: ["decision", "learnerMessage"],
            properties: {
              decision: { type: "string", enum: ["allow", "redirect", "refuse"] },
              learnerMessage: { type: "string" },
            },
          },
          check: {
            type: "object",
            additionalProperties: false,
            required: ["question", "options", "answer", "explain"],
            properties: {
              question: { type: "string" },
              options: { type: "array", items: { type: "string" } },
              answer: { type: "integer" },
              explain: { type: "string" },
            },
          },
          modules: {
            type: "array",
            items: {
              type: "object",
              additionalProperties: false,
              required: ["module", "text", "reveal", "claimIds"],
              properties: {
                module: { type: "string", enum: MODULE_ORDERS.A },
                text: levelsSchema,
                reveal: { type: ["string", "null"] },
                claimIds: { type: "array", items: { type: "string" } },
              },
            },
          },
          claims: {
            type: "array",
            items: {
              type: "object",
              additionalProperties: false,
              required: ["claimId", "text", "sourceIds"],
              properties: {
                claimId: { type: "string" },
                text: { type: "string" },
                sourceIds: { type: "array", items: { type: "string" } },
              },
            },
          },
          sources: {
            type: "array",
            items: {
              type: "object",
              additionalProperties: false,
              required: ["sourceId", "title", "publisher", "url"],
              properties: {
                sourceId: { type: "string" },
                title: { type: "string" },
                publisher: { type: "string" },
                url: { type: "string" },
              },
            },
          },
        },
      };

      function writeLiveLesson(label, question) {
        return metaComplete(
          [
            { role: "system", content: LESSON_SYSTEM },
            { role: "user", content: `Object: ${label}\nLearner question: ${question}` },
          ],
          "LiveLesson",
          LESSON_SCHEMA,
          12000,
        );
      }

      function toTopic(lesson) {
        const modules = Object.fromEntries(
          lesson.modules.map((module) => [
            module.module,
            { text: module.text, reveal: module.reveal, claims: module.claimIds },
          ]),
        );
        for (const id of MODULE_ORDERS.A)
          modules[id] ??= { text: "This part wasn't written.", claims: [] };
        return {
          check: lesson.check,
          modules,
          claims: Object.fromEntries(
            lesson.claims.map((claim) => [
              claim.claimId,
              { text: claim.text, sources: claim.sourceIds },
            ]),
          ),
          sources: Object.fromEntries(
            lesson.sources.map(({ sourceId, ...source }) => [sourceId, source]),
          ),
        };
      }

      async function downscale(file) {
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, 768 / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", 0.8);
      }

      async function metaComplete(messages, name, schema, maxTokens) {
        const response = await fetch(META_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${metaKey()}` },
          body: JSON.stringify({
            model: session.model,
            messages,
            max_tokens: maxTokens,
            reasoning_effort: "low",
            response_format: { type: "json_schema", json_schema: { name, schema, strict: true } },
          }),
        });
        if (!response.ok) throw new Error(`Meta API returned ${response.status}`);
        const data = await response.json();
        return JSON.parse(data.choices[0].message.content);
      }

      // Mirrors RECOGNITION_PROMPT_VERSION recognition-p0.1 in @sbi/recognition.
      const RECOGNITION_SYSTEM = `You identify the main everyday object in a photo for a science-learning app used by people aged 8 and up.
Return up to 3 candidate labels, most likely first, each a short common noun phrase (e.g. "bicycle", "electric kettle").
certainty: "likely" only when you would bet on it, "possible" when plausible, "unsure" otherwise; calibratedConfidence is your probability from 0 to 1.
status: "recognised" when the top candidate is clearly identifiable; "ambiguous" when two or more candidates are similarly plausible or key details are hidden; "unsupported" when the photo shows medicine, people as the subject, personal documents, or nothing identifiable, with no candidates.
observations: up to 3 short visual details that justify your answer. Never describe people.`;

      const RECOGNITION_SCHEMA = {
        type: "object",
        additionalProperties: false,
        required: ["status", "candidates", "observations"],
        properties: {
          status: { type: "string", enum: ["recognised", "ambiguous", "unsupported"] },
          candidates: {
            type: "array",
            items: {
              type: "object",
              additionalProperties: false,
              required: ["label", "certainty", "calibratedConfidence", "reasons"],
              properties: {
                label: { type: "string" },
                certainty: { type: "string", enum: ["likely", "possible", "unsure"] },
                calibratedConfidence: { type: "number" },
                reasons: { type: "array", items: { type: "string" } },
              },
            },
          },
          observations: { type: "array", items: { type: "string" } },
        },
      };

      async function recogniseLive(photoUrl) {
        const output = await metaComplete(
          [
            { role: "system", content: RECOGNITION_SYSTEM },
            {
              role: "user",
              content: [
                { type: "text", text: "What is the main object in this photo?" },
                { type: "image_url", image_url: { url: photoUrl } },
              ],
            },
          ],
          "RecognitionOutput",
          RECOGNITION_SCHEMA,
          2000,
        );
        const candidates = output.candidates.slice(0, 3).map((candidate) => ({
          label: candidate.label.replace(/^./, (ch) => ch.toUpperCase()),
          certainty: candidate.certainty,
        }));
        return { status: output.status, candidates };
      }

      const THREE_URL = "three";
      const ADDONS_URL = "three/addons/";
      const FORMATS = {
        svg: "A labelled diagram",
        glb: "A 3D model you can turn",
        sim: "A simulation you can change",
      };
      // Latin square: across every three participants each format appears once in each position.
      const VISUAL_ORDERS = [
        ["svg", "glb", "sim"],
        ["glb", "sim", "svg"],
        ["sim", "svg", "glb"],
      ];
      // Questions follow position, not format, so question difficulty is balanced across formats.
      const VISUAL_QUESTIONS = [
        {
          question:
            "The front ring has 34 teeth and the back cog has 17. How many times does the back wheel turn for one pedal turn?",
          options: ["Half a turn", "Once", "Twice", "I'm not sure"],
          answer: 2,
        },
        {
          question: "Which turns faster: the big front ring or the small back cog?",
          options: [
            "The big front ring",
            "The small back cog",
            "They turn at the same speed",
            "I'm not sure",
          ],
          answer: 1,
        },
        {
          question: "You swap to a bigger back cog. What happens to pedalling?",
          options: ["It gets harder", "It gets easier", "Nothing changes", "I'm not sure"],
          answer: 1,
        },
      ];

      function visualOrder() {
        if (session.visualOrder !== "auto") return session.visualOrder.split(",");
        const number = Number((session.participant.match(/\d+/) || ["0"])[0]);
        return VISUAL_ORDERS[number % 3];
      }

      SCREENS.visuals = () => {
        const order = visualOrder();
        const format = order[state.visualStep];
        const check = VISUAL_QUESTIONS[state.visualStep];
        return `
          ${backButton(state.returnTo || "lesson", "Back to the lesson")}
          <p class="topic-chip">Bicycle gears, way ${state.visualStep + 1} of 3</p>
          <h2>${FORMATS[format]}</h2>
          <div class="visual" id="visual-stage" data-format="${format}"></div>
          <p class="hint" id="visual-status" aria-live="polite">Loading…</p>
          <form data-action="visualAnswer" class="stack">
            <fieldset class="options">
              <legend><strong>${esc(check.question)}</strong></legend>
              ${check.options
                .map(
                  (
                    option,
                    index,
                  ) => `<label class="option"><input type="radio" name="choice" value="${index}" required />
                    <span>${esc(option)}</span></label>`,
                )
                .join("")}
            </fieldset>
            <button class="btn" type="submit">${state.visualStep < 2 ? "Next way" : "Finish"}</button>
          </form>`;
      };

      SCREENS.visualPick = () => `
        <h2>Which way helped you understand most?</h2>
        <form data-action="visualPick" class="stack">
          <fieldset class="options">
            <legend class="sr-only">Which way helped you understand most?</legend>
            ${[...Object.entries(FORMATS), ["same", "They were all about the same"]]
              .map(
                ([
                  value,
                  label,
                ]) => `<label class="option"><input type="radio" name="choice" value="${value}" required />
                  <span>${esc(label)}</span></label>`,
              )
              .join("")}
          </fieldset>
          <button class="btn" type="submit">Done</button>
        </form>`;

      Object.assign(ACTIONS, {
        visuals() {
          log("tap", { action: "visuals", order: visualOrder().join(",") });
          go("visuals", { visualStep: 0, returnTo: state.screen });
        },
        visualAnswer(form) {
          const choice = Number(new FormData(form).get("choice"));
          const format = visualOrder()[state.visualStep];
          log("visualCheck", {
            format,
            position: state.visualStep + 1,
            choice,
            correct: choice === VISUAL_QUESTIONS[state.visualStep].answer,
          });
          if (state.visualStep < 2) go("visuals", { visualStep: state.visualStep + 1 });
          else go("visualPick");
        },
        visualPick(form) {
          log("visualPreference", { format: new FormData(form).get("choice") });
          go("done");
        },
      });

      const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

      function visualReady(format, started, note = "") {
        const ms = Math.round(performance.now() - started);
        log("visualLoaded", { format, loadMs: ms });
        const status = document.getElementById("visual-status");
        if (status)
          status.textContent = FACILITATOR ? `${note}Loaded in ${(ms / 1000).toFixed(2)} s.` : note;
      }

      function gearPath(cx, cy, teeth, pitch) {
        const outer = pitch + 6;
        const root = pitch - 6;
        const step = (Math.PI * 2) / teeth;
        let d = "";
        for (let i = 0; i < teeth; i += 1) {
          const a = i * step;
          const pts = [
            [root, a],
            [outer, a + step * 0.2],
            [outer, a + step * 0.45],
            [root, a + step * 0.65],
          ];
          pts.forEach(([r, angle], index) => {
            d += `${i === 0 && index === 0 ? "M" : "L"}${(cx + r * Math.cos(angle)).toFixed(1)} ${(cy + r * Math.sin(angle)).toFixed(1)} `;
          });
        }
        return d + "Z";
      }

      function mountSvg(stage, started) {
        stage.innerHTML = `
          <svg viewBox="0 0 420 300" role="img" aria-labelledby="gear-svg-title">
            <title id="gear-svg-title">Diagram: a 34-tooth front ring linked by a chain to a 17-tooth back cog. One pedal turn makes two wheel turns.</title>
            <path d="M120 52 L310 94 M120 208 L310 166" stroke="var(--ink)" stroke-width="5" stroke-dasharray="2 5" stroke-linecap="round" fill="none"/>
            <path d="${gearPath(120, 130, 34, 78)}" fill="var(--action)" opacity=".9"/>
            <circle cx="120" cy="130" r="20" fill="var(--paper)"/>
            <path d="${gearPath(310, 130, 17, 36)}" fill="var(--highlight)"/>
            <circle cx="310" cy="130" r="10" fill="var(--paper)"/>
            <path d="M58 70 A88 88 0 0 1 182 70" fill="none" stroke="var(--ink)" stroke-width="3" marker-end="url(#arrow)"/>
            <path d="M280 82 A50 50 0 0 1 340 82" fill="none" stroke="var(--ink)" stroke-width="3" marker-end="url(#arrow)"/>
            <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--ink)"/></marker></defs>
            <g fill="var(--ink)" font-family="var(--body)" font-size="15">
              <text x="120" y="248" text-anchor="middle" font-weight="700">Front ring</text>
              <text x="120" y="268" text-anchor="middle">34 teeth, 1 pedal turn</text>
              <text x="310" y="248" text-anchor="middle" font-weight="700">Back cog</text>
              <text x="310" y="268" text-anchor="middle">17 teeth, 2 wheel turns</text>
              <text x="215" y="292" text-anchor="middle" font-size="14">34 ÷ 17 = 2</text>
            </g>
          </svg>`;
        requestAnimationFrame(() => visualReady("svg", started));
      }

      async function mountGlb(stage, started) {
        stage.innerHTML = `<canvas aria-label="3D model of a front ring, chain and back cog. Drag to turn it." role="img"></canvas>
          <p class="hint legend">Teal: front ring, 34 teeth. Yellow: back cog, 17 teeth. Drag to turn the model.</p>`;
        const canvas = stage.querySelector("canvas");
        let stopped = false;
        state.cleanup = () => {
          stopped = true;
        };
        try {
          const [THREE, { GLTFLoader }, { OrbitControls }] = await Promise.all([
            import(THREE_URL),
            import(`${ADDONS_URL}loaders/GLTFLoader.js`),
            import(`${ADDONS_URL}controls/OrbitControls.js`),
          ]);
          if (stopped) return;
          const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
          renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
          const scene = new THREE.Scene();
          scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
          const sun = new THREE.DirectionalLight(0xffffff, 2);
          sun.position.set(3, 4, 6);
          scene.add(sun);
          const camera = new THREE.PerspectiveCamera(40, 4 / 3, 0.1, 100);
          camera.position.set(0, 1.2, 7.5);
          const controls = new OrbitControls(camera, canvas);
          controls.enableZoom = false;
          controls.enablePan = false;
          const gltf = await new GLTFLoader().loadAsync("gears.glb");
          if (stopped) return;
          scene.add(gltf.scene);
          const ring = gltf.scene.getObjectByName("chainring");
          const cog = gltf.scene.getObjectByName("cog");
          const ratio = (ring.userData.teeth ?? 34) / (cog.userData.teeth ?? 17);
          const resize = () => {
            const width = stage.clientWidth;
            renderer.setSize(width, width * 0.75, false);
          };
          resize();
          let first = true;
          let last = performance.now();
          const frame = (now) => {
            if (stopped) return renderer.dispose();
            const dt = (now - last) / 1000;
            last = now;
            if (!reducedMotion()) {
              ring.rotation.z -= dt * 1.2;
              cog.rotation.z -= dt * 1.2 * ratio;
            }
            controls.update();
            renderer.render(scene, camera);
            if (first) {
              first = false;
              visualReady("glb", started);
            }
            requestAnimationFrame(frame);
          };
          requestAnimationFrame(frame);
        } catch (error) {
          log("error", { where: "glb", message: String(error.message).slice(0, 120) });
          stage.innerHTML = `<div class="notice"><p style="margin:0">The 3D model couldn't load on this device (${esc(error.message)}).</p></div>`;
          visualReady("glb", started, "Failed. ");
        }
      }

      function mountSim(stage, started) {
        stage.innerHTML = `
          <canvas width="640" height="320" aria-hidden="true"></canvas>
          <div class="sim-controls">
            <label class="field"><span>Front ring: <output id="sim-front">34</output> teeth</span>
              <input type="range" min="22" max="52" value="34" id="sim-front-input" /></label>
            <label class="field"><span>Back cog: <output id="sim-back">17</output> teeth</span>
              <input type="range" min="11" max="36" value="17" id="sim-back-input" /></label>
          </div>
          <dl class="compare sim-readout" aria-live="polite">
            <div><dt>One pedal turn</dt><dd id="sim-turns"></dd></div>
            <div><dt>Speed at 60 pedal turns a minute</dt><dd id="sim-speed"></dd></div>
            <div><dt>Effort per push</dt><dd><span class="effort"><span id="sim-effort"></span></span></dd></div>
          </dl>`;
        const canvas = stage.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        const frontInput = stage.querySelector("#sim-front-input");
        const backInput = stage.querySelector("#sim-back-input");
        const css = getComputedStyle(document.documentElement);
        let angle = 0;
        let stopped = false;
        let first = true;
        let last = performance.now();
        state.cleanup = () => {
          stopped = true;
        };

        const values = () => ({ front: Number(frontInput.value), back: Number(backInput.value) });
        function readouts() {
          const { front, back } = values();
          const ratio = front / back;
          stage.querySelector("#sim-front").textContent = front;
          stage.querySelector("#sim-back").textContent = back;
          stage.querySelector("#sim-turns").textContent = `${ratio.toFixed(2)} wheel turns`;
          // Wheel circumference about 2.1 m, as in the lesson's technical text.
          stage.querySelector("#sim-speed").textContent =
            `${((ratio * 2.1 * 60 * 60) / 1000).toFixed(1)} km/h`;
          const effort = Math.min(100, Math.round((ratio / 4.7) * 100));
          const bar = stage.querySelector("#sim-effort");
          bar.style.width = `${effort}%`;
          bar.textContent = ratio < 1.2 ? "Easy" : ratio < 2.4 ? "Medium" : "Hard";
        }
        function drawGear(x, y, teeth, scale, rotation, color) {
          const pitch = teeth * scale;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rotation);
          ctx.fillStyle = color;
          ctx.beginPath();
          for (let i = 0; i < teeth; i += 1) {
            const a = (i / teeth) * Math.PI * 2;
            const s = (Math.PI * 2) / teeth;
            [
              [pitch - 6, a],
              [pitch + 6, a + s * 0.2],
              [pitch + 6, a + s * 0.45],
              [pitch - 6, a + s * 0.65],
            ].forEach(([r, t], index) =>
              ctx[i === 0 && index === 0 ? "moveTo" : "lineTo"](r * Math.cos(t), r * Math.sin(t)),
            );
          }
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = css.getPropertyValue("--paper");
          ctx.beginPath();
          ctx.arc(0, 0, pitch * 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(-2, -pitch * 0.85, 4, pitch * 0.55);
          ctx.restore();
        }
        function frame(now) {
          if (stopped) return;
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          if (!reducedMotion()) angle += dt * Math.PI * 2;
          const { front, back } = values();
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = css.getPropertyValue("--ink");
          ctx.lineWidth = 4;
          ctx.setLineDash([3, 6]);
          ctx.beginPath();
          ctx.moveTo(190, 160 - front * 2.4);
          ctx.lineTo(480, 160 - back * 2.4);
          ctx.moveTo(190, 160 + front * 2.4);
          ctx.lineTo(480, 160 + back * 2.4);
          ctx.stroke();
          ctx.setLineDash([]);
          drawGear(190, 160, front, 2.4, angle, css.getPropertyValue("--action"));
          drawGear(
            480,
            160,
            back,
            2.4,
            (angle * front) / back,
            css.getPropertyValue("--highlight"),
          );
          if (first) {
            first = false;
            visualReady("sim", started);
          }
          requestAnimationFrame(frame);
        }
        [frontInput, backInput].forEach((input) =>
          input.addEventListener("change", () => {
            log("simChange", values());
            readouts();
          }),
        );
        [frontInput, backInput].forEach((input) => input.addEventListener("input", readouts));
        readouts();
        requestAnimationFrame(frame);
      }

      const MOUNTS = { svg: mountSvg, glb: mountGlb, sim: mountSim };

      function renderFacilitator() {
        const dialog = document.getElementById("facilitator");
        const hasKey = Boolean(metaKey());
        dialog.innerHTML = `
          <form method="dialog" class="panel-grid" id="facilitator-form">
            <h2 id="facilitator-title">Session</h2>
            <p class="hint">For the person running the session. Learners don't need this panel.</p>
            <div class="field"><label for="f-participant">Participant code</label>
              <input id="f-participant" name="participant" value="${esc(session.participant)}" placeholder="C01" autocomplete="off" /></div>
            <div class="field"><label for="f-segment">Segment</label>
              <select id="f-segment" name="segment">
                ${["", "child 8-12", "teen", "adult", "family"]
                  .map(
                    (value) =>
                      `<option value="${value}" ${session.segment === value ? "selected" : ""}>${value || "Choose…"}</option>`,
                  )
                  .join("")}
              </select></div>
            <div class="field"><label for="f-order">Lesson module order</label>
              <select id="f-order" name="moduleOrder">
                <option value="A" ${session.moduleOrder === "A" ? "selected" : ""}>A: big idea before parts (spec order)</option>
                <option value="B" ${session.moduleOrder === "B" ? "selected" : ""}>B: parts and hands-on before big idea</option>
              </select></div>
            <div class="field"><label for="f-visual">Visual order</label>
              <select id="f-visual" name="visualOrder">
                ${[
                  ["auto", "Auto from participant number"],
                  ...VISUAL_ORDERS.map((order) => [order.join(","), order.join(", ")]),
                ]
                  .map(
                    ([value, label]) =>
                      `<option value="${value}" ${session.visualOrder === value ? "selected" : ""}>${label}</option>`,
                  )
                  .join("")}
              </select></div>
            <div class="field"><label for="f-mode">Mode</label>
              <select id="f-mode" name="mode">
                <option value="demo" ${session.mode === "demo" ? "selected" : ""}>Demo: sample photos and prepared lessons</option>
                <option value="live" ${session.mode === "live" ? "selected" : ""}>Live: real photos via Meta Model API</option>
              </select></div>
            <div class="field"><label for="f-key">Meta Model API key</label>
              <input id="f-key" name="key" type="password" autocomplete="off" placeholder="${hasKey ? "Key saved for this tab" : "Paste key for live mode"}" />
              <span class="hint">Kept in this browser tab only and cleared when you close it. Use a Standard-mode key so content isn't used for training.</span></div>
            <div class="field"><label for="f-model">Meta model</label>
              <input id="f-model" name="model" value="${esc(session.model)}" autocomplete="off" /></div>
            <p class="hint">${session.events.length} events since ${esc(session.startedAt.slice(0, 16).replace("T", " "))}</p>
            <ul class="log" id="event-log">${session.events
              .slice(-30)
              .reverse()
              .map(
                (event) =>
                  `<li>${esc(event.type)} ${esc(JSON.stringify({ ...event, at: undefined, ms: undefined, type: undefined }))}</li>`,
              )
              .join("")}</ul>
            <div class="row">
              <button class="btn" value="save">Save</button>
              <button class="btn secondary" type="button" id="f-json">Export JSON</button>
              <button class="btn secondary" type="button" id="f-csv">Export CSV</button>
              <button class="btn quiet" type="button" id="f-new">New session</button>
            </div>
          </form>`;
        dialog.querySelector("#f-json").addEventListener("click", () => download("json"));
        dialog.querySelector("#f-csv").addEventListener("click", () => download("csv"));
        dialog.querySelector("#f-new").addEventListener("click", () => {
          if (!confirm("Start a new session? Export this one first if you need it.")) return;
          try {
            localStorage.removeItem(STORE_KEY);
          } catch {}
          session = loadSession();
          saveSession();
          renderFacilitator();
          go("home", { sample: null, photoUrl: null, recognition: null });
        });
        dialog.querySelector("form").addEventListener("submit", () => {
          const form = dialog.querySelector("form");
          Object.assign(session, {
            participant: form.participant.value.trim(),
            segment: form.segment.value,
            mode: form.mode.value,
            moduleOrder: form.moduleOrder.value,
            visualOrder: form.visualOrder.value,
            model: form.model.value.trim() || "muse-spark-1.3",
          });
          if (form.key.value.trim()) {
            try {
              sessionStorage.setItem(KEY_KEY, form.key.value.trim());
            } catch {}
          }
          log("session", {
            participant: session.participant,
            segment: session.segment,
            mode: session.mode,
          });
          render();
        });
      }

      function download(kind) {
        const name = `sbi-session-${session.participant || "anon"}-${session.startedAt.slice(0, 10)}`;
        let body;
        if (kind === "json") {
          const { events, ...meta } = session;
          body = JSON.stringify({ ...meta, events }, null, 2);
        } else {
          const columns = ["at", "ms", "screen", "type", "data"];
          const rows = session.events.map((event) => {
            const { at, ms, screen, type, ...data } = event;
            return [at, ms, screen, type, JSON.stringify(data)]
              .map((cell) => `"${String(cell).replace(/"/g, '""')}"`)
              .join(",");
          });
          body = [columns.join(","), ...rows].join("\n");
        }
        const url = URL.createObjectURL(
          new Blob([body], { type: kind === "json" ? "application/json" : "text/csv" }),
        );
        const link = Object.assign(document.createElement("a"), {
          href: url,
          download: `${name}.${kind}`,
        });
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        log("export", { kind });
      }

      if (FACILITATOR) {
        const toggle = document.getElementById("facilitator-toggle");
        toggle.hidden = false;
        toggle.addEventListener("click", () => {
          renderFacilitator();
          document.getElementById("facilitator").showModal();
        });
      }

      render();
      log("open", { facilitator: FACILITATOR });
    </script>
  </body>
</html>
