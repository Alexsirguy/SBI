<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Science Behind It</title>
    <meta
      name="description"
      content="Prototype: photograph an everyday object and learn the science behind it."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='14' r='9' fill='none' stroke='%230d6b67' stroke-width='4'/%3E%3Cpath d='M21 21l7 7' stroke='%230d6b67' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap"
    />
    <style>
      :root {
        --bench: #eef2f1;
        --paper: #ffffff;
        --ink: #14263a;
        --ink-soft: #4f6172;
        --rule: #c9d3d6;
        --action: #0d6b67;
        --action-ink: #ffffff;
        --highlight: #ffd23f;
        --caution: #a8321f;
        --tag: #f7e7b4;
        --focus: #1f5fd1;
        --radius-s: 6px;
        --radius-l: 18px;
        --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
        --display: "Bricolage Grotesque", "Atkinson Hyperlegible Next", system-ui, sans-serif;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bench: #0f1a24;
          --paper: #17242f;
          --ink: #e8eef2;
          --ink-soft: #a9b8c4;
          --rule: #2f4150;
          --action: #4cc2b8;
          --action-ink: #06201e;
          --highlight: #e8bd2c;
          --caution: #ff8a73;
          --tag: #3a3418;
          --focus: #8fb4ff;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bench: #0f1a24;
        --paper: #17242f;
        --ink: #e8eef2;
        --ink-soft: #a9b8c4;
        --rule: #2f4150;
        --action: #4cc2b8;
        --action-ink: #06201e;
        --highlight: #e8bd2c;
        --caution: #ff8a73;
        --tag: #3a3418;
        --focus: #8fb4ff;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bench);
        color: var(--ink);
        font: 400 1.0625rem/1.55 var(--body);
        min-height: 100dvh;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.25rem 1rem 6rem;
      }
      h1,
      h2,
      h3 {
        font-family: var(--display);
        line-height: 1.1;
        margin: 0 0 0.5rem;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: clamp(2rem, 7vw, 2.75rem);
        font-weight: 800;
      }
      h2 {
        font-size: 1.5rem;
        font-weight: 600;
      }
      h3 {
        font-size: 1.15rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1rem;
        max-width: 34rem;
      }
      a {
        color: var(--action);
      }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .lede {
        color: var(--ink-soft);
        font-size: 1.125rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 3rem;
        padding: 0.75rem 1.25rem;
        border-radius: 999px;
        border: 2px solid var(--action);
        background: var(--action);
        color: var(--action-ink);
        font: 600 1.0625rem/1 var(--body);
        cursor: pointer;
        text-decoration: none;
      }
      .btn.secondary {
        background: transparent;
        color: var(--action);
      }
      .btn.quiet {
        border-color: transparent;
        background: transparent;
        color: var(--ink-soft);
        text-decoration: underline;
        padding-inline: 0.25rem;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: flex-start;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }
      .back {
        margin-bottom: 1rem;
      }

      .samples {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
        margin: 1rem 0 1.5rem;
        padding: 0;
        list-style: none;
      }
      .sample {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        padding: 0.5rem 0.5rem 0.65rem;
        border: 1px solid var(--rule);
        border-radius: var(--radius-s);
        background: var(--paper);
        color: var(--ink);
        font: 600 0.95rem/1.2 var(--body);
        text-align: left;
        cursor: pointer;
      }
      .sample svg,
      .photo svg,
      .photo img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 4px;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }
      .capture {
        position: relative;
        overflow: hidden;
      }
      .capture input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      .photo {
        position: relative;
        border-radius: var(--radius-l);
        overflow: hidden;
        background: var(--paper);
        border: 1px solid var(--rule);
      }
      .scanline {
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--highlight);
        box-shadow: 0 0 18px 6px color-mix(in srgb, var(--highlight) 55%, transparent);
        animation: scan 1.4s ease-in-out infinite alternate;
      }
      @keyframes scan {
        from {
          top: 4%;
        }
        to {
          top: 94%;
        }
      }

      .tag {
        position: relative;
        margin: -1.75rem 0 1.25rem 1.25rem;
        width: min(19rem, 85%);
        padding: 0.85rem 1rem 0.9rem 1.6rem;
        background: var(--tag);
        color: var(--ink);
        border-radius: 4px 14px 14px 4px;
        clip-path: polygon(0.9rem 0, 100% 0, 100% 100%, 0.9rem 100%, 0 50%);
        transform: rotate(-2deg);
        box-shadow: 0 2px 0 var(--rule);
      }
      .tag::before {
        content: "";
        position: absolute;
        left: 0.75rem;
        top: 50%;
        width: 0.55rem;
        height: 0.55rem;
        margin-top: -0.275rem;
        border-radius: 50%;
        background: var(--bench);
        box-shadow: inset 0 0 0 2px var(--ink-soft);
      }
      .tag .label {
        font: 800 1.6rem/1.05 var(--display);
        display: block;
      }
      .tag .certainty {
        font-size: 0.95rem;
        color: var(--ink-soft);
      }
      .choices {
        list-style: none;
        padding: 0;
        margin: 0 0 1rem;
        display: grid;
        gap: 0.5rem;
        width: 100%;
      }
      .choice {
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1rem;
        border-radius: var(--radius-s);
        border: 1px solid var(--rule);
        background: var(--paper);
        color: var(--ink);
        font: 600 1.05rem/1.3 var(--body);
        text-align: left;
        cursor: pointer;
      }
      .choice small {
        font-weight: 400;
        color: var(--ink-soft);
      }
      .field {
        display: grid;
        gap: 0.35rem;
        width: 100%;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        min-height: 2.75rem;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--ink-soft);
        border-radius: var(--radius-s);
        background: var(--paper);
        color: var(--ink);
        font: inherit;
      }
      .hint {
        font-size: 0.9rem;
        color: var(--ink-soft);
      }
      .notice {
        border-left: 4px solid var(--caution);
        padding: 0.75rem 1rem;
        background: var(--paper);
        border-radius: 0 var(--radius-s) var(--radius-s) 0;
        margin-bottom: 1rem;
      }

      .facilitator-toggle {
        position: fixed;
        right: 1rem;
        bottom: calc(1rem + env(safe-area-inset-bottom));
        z-index: 10;
        box-shadow: 0 2px 0 var(--rule);
      }
      dialog {
        width: min(36rem, calc(100vw - 2rem));
        max-height: calc(100dvh - 2rem);
        border: 1px solid var(--rule);
        border-radius: var(--radius-l);
        background: var(--paper);
        color: var(--ink);
        padding: 1.25rem;
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.45);
      }
      .panel-grid {
        display: grid;
        gap: 0.85rem;
      }
      .log {
        max-height: 10rem;
        overflow: auto;
        font-size: 0.85rem;
        color: var(--ink-soft);
        border: 1px solid var(--rule);
        border-radius: var(--radius-s);
        padding: 0.5rem;
        margin: 0;
        list-style: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      .options {
        border: 0;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.5rem;
        width: 100%;
      }
      .option {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 0.85rem 1rem;
        border: 1px solid var(--rule);
        border-radius: var(--radius-s);
        background: var(--paper);
        cursor: pointer;
        font-weight: 600;
      }
      .option input {
        width: 1.25rem;
        height: 1.25rem;
        accent-color: var(--action);
        flex: none;
      }
      .option:has(input:checked) {
        border-color: var(--action);
        box-shadow: inset 0 0 0 1px var(--action);
      }
      .topic-chip {
        display: inline-block;
        margin: 0 0 0.5rem;
        padding: 0.15rem 0.6rem 0.2rem;
        background: var(--tag);
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .depth {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.25rem;
        border: 0;
        padding: 0;
        margin: 0.25rem 0 1.5rem;
      }
      .depth legend {
        float: left;
        margin-right: 0.5rem;
        color: var(--ink-soft);
        font-size: 0.95rem;
      }
      .depth label {
        position: relative;
      }
      .depth input {
        position: absolute;
        opacity: 0;
        inset: 0;
      }
      .depth span {
        display: block;
        padding: 0.45rem 0.9rem;
        border: 1px solid var(--rule);
        border-radius: 999px;
        background: var(--paper);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .depth input:checked + span {
        background: var(--ink);
        color: var(--bench);
        border-color: var(--ink);
      }
      .depth input:focus-visible + span {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      /* The depth rail: a line that fills as the learner goes deeper, with unopened parts left hollow. */
      .rail {
        list-style: none;
        margin: 0 0 1.25rem;
        padding: 0 0 0 1.75rem;
        position: relative;
      }
      .module {
        position: relative;
        padding: 0 0 1.5rem;
      }
      .module::before {
        content: "";
        position: absolute;
        left: -1.75rem;
        top: 0.15rem;
        width: 0.9rem;
        height: 0.9rem;
        margin-left: 0.05rem;
        border-radius: 50%;
        background: var(--action);
        box-shadow: 0 0 0 3px var(--bench);
        z-index: 1;
      }
      .module::after {
        content: "";
        position: absolute;
        left: calc(-1.75rem + 0.45rem);
        top: 0.5rem;
        bottom: -0.5rem;
        width: 3px;
        background: var(--action);
      }
      .module:last-child::after {
        display: none;
      }
      .module.ghost {
        padding-bottom: 0.9rem;
        color: var(--ink-soft);
        opacity: 0.75;
      }
      .module.ghost::before {
        background: var(--bench);
        box-shadow:
          inset 0 0 0 2px var(--rule),
          0 0 0 3px var(--bench);
      }
      .module.ghost::after {
        background: var(--rule);
      }
      .module:not(.ghost):has(+ .ghost)::after {
        background: linear-gradient(var(--action), var(--rule));
      }
      .module h3 {
        margin-bottom: 0.35rem;
      }
      .module.answer > p:first-of-type {
        font-size: 1.2rem;
        line-height: 1.5;
      }
      mark {
        background: linear-gradient(
          transparent 12%,
          var(--highlight) 12%,
          var(--highlight) 88%,
          transparent 88%
        );
        color: var(--ink);
        padding: 0 0.1em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      details {
        margin: 0 0 0.75rem;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        color: var(--action);
      }
      .sources {
        font-size: 0.9rem;
        color: var(--ink-soft);
        margin: 0.25rem 0 0;
      }
      .guess {
        margin: 0.25rem 0 0.75rem;
      }
      .guess legend {
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      .why {
        margin: 0.25rem 0 0.75rem;
        padding: 0.6rem 0.8rem;
        border-left: 3px solid var(--action);
        background: var(--paper);
      }
      .why p {
        margin: 0;
      }
      .why .why-q {
        color: var(--ink-soft);
        font-size: 0.95rem;
        margin-bottom: 0.25rem;
      }
      .evidence summary {
        font-size: 0.9rem;
      }
      .evidence ul {
        margin: 0.4rem 0 0;
        padding-left: 1.1rem;
        font-size: 0.95rem;
      }
      .lesson-actions {
        position: sticky;
        bottom: 0;
        padding: 0.75rem 0 calc(0.75rem + env(safe-area-inset-bottom));
        background: linear-gradient(transparent, var(--bench) 30%);
      }
      .compare {
        display: grid;
        gap: 0.5rem;
        margin: 0 0 1rem;
      }
      .compare div {
        padding: 0.75rem 1rem;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: var(--radius-s);
      }
      .compare dt {
        color: var(--ink-soft);
        font-size: 0.9rem;
      }
      .compare dd {
        margin: 0;
        font-weight: 600;
      }
      .visual {
        border-radius: var(--radius-l);
        border: 1px solid var(--rule);
        background: var(--paper);
        padding: 0.75rem;
        margin-bottom: 0.5rem;
      }
      .visual svg,
      .visual canvas {
        display: block;
        width: 100%;
        height: auto;
        touch-action: pan-y;
      }
      .visual .legend {
        margin: 0.5rem 0 0;
      }
      .sim-controls {
        display: grid;
        gap: 0.75rem;
        margin: 0.75rem 0;
      }
      .sim-controls input[type="range"] {
        min-height: 2.75rem;
        padding: 0;
        border: 0;
        accent-color: var(--action);
      }
      .effort {
        display: block;
        height: 1.6rem;
        border-radius: 999px;
        background: var(--bench);
        overflow: hidden;
      }
      .effort span {
        display: block;
        height: 100%;
        min-width: 4rem;
        padding: 0 0.6rem;
        background: var(--ink);
        color: var(--bench);
        font-size: 0.85rem;
        line-height: 1.6rem;
      }
      .compare small {
        font-weight: 400;
        color: var(--ink-soft);
      }
      @media (min-width: 36rem) {
        .samples {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main id="app" tabindex="-1"></main>
    <p id="status" class="sr-only" aria-live="polite"></p>
    <button id="facilitator-toggle" class="btn secondary facilitator-toggle" type="button" hidden>
      Session
    </button>
    <dialog id="facilitator" aria-labelledby="facilitator-title"></dialog>

    <script type="application/json" id="demo-data">
      {
        "source": "authored",
        "samples": [
          {
            "id": "bicycle",
            "name": "Bicycle",
            "path": "confident",
            "recognition": {
              "status": "recognised",
              "candidates": [

              ]

          },

                },

                  "label": "Coffee pot",
                  "certainty": "unsure"
                }
              ]
            }
          },
          {
            "id": "leaf",
            "name": "Leaf",
            "path": "confident",
            "recognition": {
              "status": "recognised",
              "candidates": [
                {
                  "label": "Leaf",
                  "certainty": "likely",
                  "topic": "leaf"
                },
                {
                  "label": "Lettuce",

                }
              ]
            }
          },
          {
            "id": "pills",
            "name": "Tablets",
            "path": "unsupported",
            "recognition": {
              "status": "unsupported",
              "candidates": [],
              "redirect": "This looks like medicine. We don't explain medicines, because the right answer depends on the person. A pharmacist, doctor or trusted adult can help."
            }
          }
        ],
        "topics": {
          "bicycle": {
            "label": "Bicycle",
            "aliases": ["bicycle", "bike", "cycle"],
            "visual": "gears",
            "questions": [
              "Why does a low gear make pedalling uphill easier?",
              "How do bike gears help me get up hills?",
              "Why do racing cyclists use big gears on flat roads?"
            ],
            "check": {
              "question": "On a steep hill, which gear makes pedalling easiest?",
              "options": [
                "Big front ring, small back cog",
                "Small front ring, big back cog",
                "It makes no difference",
                "I'm not sure"
              ],
              "answer": 1,
              "explain": "A small front ring with a big back cog turns the wheel less per pedal turn, so each push needs less force."
            },
            "steps": [
              {
                "module": "what-youre-seeing",
                "title": "What you're seeing",
                "text": {
                  "simple": "A bike with pedals, a chain and toothed wheels. Some gears make a hill feel easy and some make it feel really hard, but the hill is the same. So what changes?",
                  "plain": "A bicycle: the pedals turn a toothed ring at the front, and a chain carries that turn to a toothed cog on the back wheel. Same rider, same hill, but in one gear it's easy and in another it's exhausting. What's different?",
                  "technical": "A chain-driven bicycle: the chainring on the crankset drives a rear cog through a roller chain, and a derailleur moves the chain between sprockets. The climb is identical in every gear, yet the effort per pedal stroke isn't. Why?"
                },
                "claims": ["b1"]
              },
              {
                "module": "short-answer",
                "title": "The short answer",
                "text": {
                  "simple": "A low gear makes you pedal more times to climb the hill, but every push is easier.",
                  "plain": "A low gear swaps speed for force: your feet go round more times for each metre you climb, so each push needs less effort.",
                  "technical": "A low gear (small chainring ÷ cog ratio) trades wheel speed for torque: more crank revolutions per metre climbed, so less force per stroke for the same power."
                },
                "claims": ["b2", "b3"]
              },
              {
                "module": "first-principles",
                "title": "Start from what's true",
                "text": {
                  "simple": "To get up a hill, you have to lift yourself and your bike. Lifting something heavy always takes the same amount of energy, however you do it.",
                  "plain": "Climbing a hill means lifting you and the bike up by its height. Lifting a weight through a height always takes the same energy: weight × height. That's fixed before you even pick a gear.",
                  "technical": "Climbing raises the rider and bike's potential energy by m·g·h. That amount is set by the mass and the height of the hill, not by the route or the drivetrain."
                },
                "claims": ["b8"],
                "guess": {
                  "question": "Can changing gear reduce the energy you need to get up the hill?",
                  "options": ["Yes, that's what gears are for", "No, the energy stays the same"],
                  "answer": 1,
                  "why": {
                    "simple": "No. A machine can't make energy from nothing, so the hill always needs the same amount. Gears can only change how that job is shared out.",
                    "plain": "No. No machine creates energy, so the climb costs the same in every gear. Gears can only change how the work is split into pushes.",
                    "technical": "No. Energy is conserved, and a gear train only changes the ratio of force to distance (its mechanical advantage). Friction means real gears waste a little, never save any."
                  }
                }
              },
              {
                "module": "first-principles",
                "title": "Energy is push × distance",
                "text": {
                  "simple": "The energy you use is how hard you push times how far you push. So you can do the same job with a big push over a short way, or a small push over a long way.",
                  "plain": "Work (energy) = force × distance. The same amount of work can be a big force over a short distance or a small force over a long distance.",

    <script>

          0, 1, 2,
        ]

            [0, 1, 2, 3]
              .map((c) => `<ellipse cx="${115 + c * 57}" cy="${100 + r * 50}" rx="20" ry="14"/>`)
              .join(""),

          .join("")}</g></svg>`,
      };

      const state = {
        screen: "home",
        sample: null,
        photoUrl: null,
        recognition: null,
        topic: null,
        question: null,
        level: "plain",
        shown: 2,
        guesses: {},
        pre: null,
        post: null,
        lessonStartedAt: 0,
      };

      function loadSession() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
          if (saved) return saved;
        } catch {}
        return {
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
          participant: "",
          segment: "",
          variant: "A",
          visualOrder: "auto",
          mode: "demo",
          model: "muse-spark-1.3",
          startedAt: new Date().toISOString(),
          events: [],
        };
      }
      let session = loadSession();

      function saveSession() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(session));
        } catch {}
      }

      function metaKey() {
        try {
          return sessionStorage.getItem(KEY_KEY) || "";
        } catch {
          return "";
        }
      }

      // Events hold taps, timings and answers only; photos and free text never enter the log.
      function log(type, data = {}) {
        const event = {
          at: new Date().toISOString(),
          ms: Math.round(performance.now()),
          screen: state.screen,
          type,
          ...data,
        };
        session.events.push(event);
        saveSession();
        const list = document.getElementById("event-log");
        if (list)
          list.insertAdjacentHTML(
            "afterbegin",
            `<li>${esc(type)} ${esc(JSON.stringify(data))}</li>`,
          );
      }

      function esc(value) {
        return String(value).replace(
          /[&<>"']/g,
          (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch],
        );
      }

      function announce(text) {
        document.getElementById("status").textContent = text;
      }

      function go(screen, patch = {}) {
        state.cleanup?.();
        state.cleanup = null;
        Object.assign(state, patch, { screen });
        log("screen", { to: screen });
        render();
        window.scrollTo(0, 0);
        const heading = app.querySelector("h1, h2");
        if (heading) {
          heading.setAttribute("tabindex", "-1");
          heading.focus({ preventScroll: true });
        }
      }

      const SCREENS = {};

      function render() {
        app.innerHTML = SCREENS[state.screen]();
        app.querySelectorAll("[data-action]").forEach((el) => {
          const handler = ACTIONS[el.dataset.action];
          el.addEventListener(el.tagName === "FORM" ? "submit" : "click", (event) => {
            if (el.tagName === "FORM") event.preventDefault();
            handler(el, event);
          });
        });
        app
          .querySelectorAll("[data-change]")
          .forEach((el) =>
            el.addEventListener("change", (event) => ACTIONS[el.dataset.change](el, event)),
          );
        const stage = document.getElementById("visual-stage");
        if (stage) MOUNTS[stage.dataset.format](stage, performance.now());
      }

      const backButton = (to, label = "Back") =>
        `<button class="btn quiet back" type="button" data-action="back" data-to="${to}">${label}</button>`;

      function photoMarkup() {
        if (state.photoUrl) return `<img src="${state.photoUrl}" alt="Your photo" />`;
        return ART[state.sample?.id] ?? "";
      }

      SCREENS.home = () => `
        <h1>What's the science behind it?</h1>
        <p class="lede">Take a photo of something near you. We'll work out what it is, then show you how it works.</p>
        <div class="stack">
          <label class="btn capture">
            Take a photo
            <input type="file" accept="image/*" capture="environment" data-change="photo" />
          </label>
          ${
            session.mode === "live" && metaKey()
              ? `<p class="hint">Live mode: your photo is sent to Meta's model to recognise it, and isn't saved here.</p>`
              : `<p class="hint">In this demo, pick one of these photos to try it.</p>`
          }
        </div>
        <h2>Try a sample photo</h2>
        <ul class="samples">
          ${DEMO.samples
            .map(
              (
                sample,
              ) => `<li><button class="sample" type="button" data-action="sample" data-id="${sample.id}">
                ${ART[sample.id]}<span>${esc(sample.name)}</span></button></li>`,
            )
            .join("")}
        </ul>`;

      SCREENS.looking = () => `
        <h2>Looking closely…</h2>
        <div class="photo">${photoMarkup()}<div class="scanline" aria-hidden="true"></div></div>
        <p class="hint" style="margin-top:1rem">Checking shapes, parts and materials.</p>`;

      const CERTAINTY_COPY = {
        likely: "We're fairly sure",
        possible: "This is our best guess",
        unsure: "We're not sure about this one",
      };

      SCREENS.confirm = () => {
        const result = state.recognition;
        const [top, ...rest] = result.candidates;
        if (result.status === "unsupported" || !top) return SCREENS.unsupported();
        if (result.status === "ambiguous") {
          return `
            ${backButton("home", "Try a different photo")}
            <div class="photo">${photoMarkup()}</div>
            <h2 style="margin-top:1.25rem">Which one is it?</h2>
            <p>We can see a few possibilities. Pick the one that matches.</p>
            <ul class="choices">
              ${result.candidates
                .map(
                  (
                    candidate,
                    index,
                  ) => `<li><button class="choice" type="button" data-action="pick" data-index="${index}">
                    <span>${esc(candidate.label)}</span><small>${candidate.certainty === "possible" ? "possible" : "less likely"}</small></button></li>`,
                )
                .join("")}
            </ul>
            ${somethingElse()}`;
        }
        return `
          ${backButton("home", "Try a different photo")}
          <div class="photo">${photoMarkup()}</div>
          <div class="tag" role="group" aria-label="Our guess">
            <span class="label">${esc(top.label)}</span>
            <span class="certainty">${CERTAINTY_COPY[top.certainty]}</span>
          </div>
          <h2>Is this a ${esc(top.label.toLowerCase())}?</h2>
          <div class="row" style="margin-bottom:1.25rem">
            <button class="btn" type="button" data-action="pick" data-index="0">Yes, that's it</button>

          ${
            rest.length
              ? `<h3>Or is it…</h3><ul class="choices">${rest
                  .map(
                    (
                      candidate,
                      index,
                    ) => `<li><button class="choice" type="button" data-action="pick" data-index="${index + 1}">
                      <span>${esc(candidate.label)}</span><small>less likely</small></button></li>`,
                  )
                  .join("")}</ul>`
              : ""
          }
          ${somethingElse()}`;
      };

      function somethingElse() {
        return `
          <form class="field" data-action="correct">

          </form>`;

      SCREENS.unsupported = () => `

      SCREENS.nolesson = () => `

          session.mode === "live"

            : "Turn on live mode in the session panel to try anything else."

      SCREENS.question = () => {
        const topic = DEMO.topics[state.topic];

          <h2>What do you want to know about the ${esc(topic.label.toLowerCase())}?</h2>

            ${topic.questions
              .map(
                (
                  question,
                  index,
                ) => `<li><button class="choice" type="button" data-action="question" data-index="${index}">

              .join("")}

            topic.live
              ? `<form class="field" data-action="ownQuestion">

      // Each step is tagged with one of the 8 Lesson contract modules, so lessons still map onto it.
      const MODULES = [
        "what-youre-seeing",
        "short-answer",
        "first-principles",
        "how-parts-work",
        "try-an-idea",
        "history",
        "check-thinking",
        "go-further",

      function checkMarkup(kind) {
        const check = currentTopic().check;
        const before = kind === "pre";

                    option,

                .join("")}

          </form>
          ${before ? `<p class="hint">It's fine to guess. This isn't a test of you.</p>` : ""}`;
      }

      SCREENS.precheck = () => checkMarkup("pre");
      SCREENS.postcheck = () => checkMarkup("post");

      SCREENS.writing = () => `
        <h2>Writing your lesson…</h2>
        <p class="lede">Working out “${esc(state.question)}” from the beginning.</p>
        <div class="photo">${photoMarkup()}<div class="scanline" aria-hidden="true"></div></div>`;

      // Evidence stays one tap away, so the lesson reads as reasoning rather than a list of citations.
      function evidenceFor(claimIds, index) {
        const topic = currentTopic();
        const claims = claimIds.map((id) => topic.claims[id]).filter(Boolean);
        if (!claims.length) return "";
        const link = (source) =>
          `<a href="${esc(source.url)}" target="_blank" rel="noopener" data-source="${esc(source.title)}">${esc(source.title)}</a>`;
        return `<details class="evidence" data-evidence="${index}"><summary>How do we know?</summary><ul>${claims
          .map(
            (claim) =>
              `<li>${esc(claim.text)} <span class="sources">(${claim.sources
                .map((id) => topic.sources[id])
                .filter(Boolean)
                .map(link)
                .join(", ")})</span></li>`,
          )
          .join("")}</ul></details>`;
      }

      // A guess is asked only in variant A, until answered, and if the live check hasn't dropped it.
      const asks = (step, index) =>
        Boolean(step?.guess) &&
        !step.guess.dropped &&
        guessing() &&
        state.guesses[index] === undefined;

      function guessMarkup(guess, index) {
        const choice = state.guesses[index];
        if (guess.dropped && choice === undefined) {
          return `<div class="why" id="why-${index}" tabindex="-1"><p>${esc(levelText(guess.why))}</p></div>`;
        }
        if (asks({ guess }, index)) {
          return `
            <form class="guess stack" data-action="guess" data-index="${index}">
              <fieldset class="options">
                <legend>${esc(guess.question)}</legend>
                ${[...guess.options, "I'm not sure"]
                  .map(
                    (option, value) =>
                      `<label class="option"><input type="radio" name="choice" value="${
                        value === guess.options.length ? -1 : value
                      }" required /><span>${esc(option)}</span></label>`,
                  )
                  .join("")}
              </fieldset>
              <button class="btn secondary" type="submit">Check my guess</button>
            </form>`;
        }
        const verdict =
          choice === undefined || choice === -1
            ? ""
            : choice === guess.answer
              ? "Yes. "
              : "Not quite. ";
        return `
          <div class="why" id="why-${index}" tabindex="-1">
            <p class="why-q">${esc(guess.question)}</p>
            <p>${verdict ? `<strong>${verdict}</strong>` : ""}${esc(levelText(guess.why))}</p>
          </div>`;
      }

      function stepMarkup(step, index) {
        const answer = step.module === "short-answer";
        const text = esc(levelText(step.text));
        // Evidence can give the guess away, so it waits until the learner has committed.
        const pending = asks(step, index);
        return `
          <li class="module${answer ? " answer" : ""}" id="s-${index}" data-module="${step.module}">
            <h3>${esc(step.title)}</h3>
            <p>${answer ? `<mark>${text}</mark>` : text}</p>
            ${step.guess ? guessMarkup(step.guess, index) : ""}
            ${
              step.visual && currentTopic().visual && SCREENS.visuals
                ? `<button class="btn secondary" type="button" data-action="lab">See it in action</button>`
                : ""
            }
            ${pending ? "" : evidenceFor(step.claims ?? [], index)}
          </li>`;
      }

      SCREENS.lesson = () => {
        const steps = currentTopic().steps;
        const last = steps[state.shown - 1];
        const waiting = asks(last, state.shown - 1);
        const next = waiting ? null : steps[state.shown];
        return `
          ${backButton("question", "Change question")}
          <p class="topic-chip">${esc(currentTopic().label)}</p>
          <h2>${esc(state.question)}</h2>
          <fieldset class="depth">
            <legend>Explain it</legend>
            ${LEVELS.map(
              ([value, label]) =>
                `<label><input type="radio" name="level" value="${value}" data-change="level" ${
                  state.level === value ? "checked" : ""
                } /><span>${label}</span></label>`,
            ).join("")}
          </fieldset>
          <ol class="rail" aria-label="Lesson, ${state.shown} of ${steps.length} steps open">
            ${steps.slice(0, state.shown).map(stepMarkup).join("")}
            ${steps
              .slice(state.shown)
              .map(
                (step) =>
                  `<li class="module ghost" aria-hidden="true"><span>${esc(step.title)}</span></li>`,
              )
              .join("")}
          </ol>
          <div class="row lesson-actions">
            ${next ? `<button class="btn" type="button" data-action="deeper">${state.shown === 2 ? "Show me why" : `Next: ${esc(next.title.toLowerCase())}`}</button>` : ""}
            <button class="btn ${next ? "secondary" : ""}" type="button" data-action="finish">I've got it</button>
          </div>`;
      };

      SCREENS.result = () => {
        const check = currentTopic().check;
        const mark = (choice) => (choice === check.answer ? "right" : "not quite");
        return `
          <h2>${state.post === check.answer ? "You've got it" : "Nearly there"}</h2>
          <dl class="compare">
            <div><dt>Before the lesson</dt><dd>${esc(check.options[state.pre] ?? "–")} <small>(${mark(state.pre)})</small></dd></div>
            <div><dt>After the lesson</dt><dd>${esc(check.options[state.post] ?? "–")} <small>(${mark(state.post)})</small></dd></div>
          </dl>
          <p>${esc(check.explain)}</p>
          <form class="field" data-action="explainBack">
            <label for="explain-back">Now explain it in your own words. You can say it out loud or type it here.</label>
            <textarea id="explain-back" name="text" rows="4"></textarea>
            <div class="row" style="margin-top:0.5rem">
              <button class="btn" type="submit">Done</button>
              ${currentTopic().visual === "gears" && SCREENS.visuals ? `<button class="btn secondary" type="button" data-action="visuals">Compare ways of seeing it</button>` : ""}
            </div>
          </form>`;
      };

      SCREENS.done = () => `
        <h2>Thanks for trying it</h2>
        <p class="lede">What would you like to look at next?</p>
        <button class="btn" type="button" data-action="back" data-to="home">Take another photo</button>`;

      const ACTIONS = {
        back(el) {
          log("tap", { action: "back", to: el.dataset.to });
          go(
            el.dataset.to,
            el.dataset.to === "home" ? { sample: null, photoUrl: null, recognition: null } : {},
          );
        },
        sample(el) {
          const sample = DEMO.samples.find((item) => item.id === el.dataset.id);
          log("sample", { sample: sample.id, path: sample.path });
          startRecognition({ sample, recognition: sample.recognition });
        },
        async photo(el) {
          const file = el.files?.[0];
          if (!file) return;
          const photoUrl = await downscale(file);
          log("photo", { live: session.mode === "live" && Boolean(metaKey()) });
          if (session.mode === "live" && metaKey()) {
            go("looking", { sample: null, photoUrl });
            try {
              const recognition = await recogniseLive(photoUrl);
              log("recognition", {
                status: recognition.status,
                candidates: recognition.candidates.length,
              });
              go("confirm", { recognition });
            } catch (error) {
              log("error", { where: "recognition", message: String(error.message).slice(0, 120) });
              go("unsupported", {
                recognition: {
                  status: "unsupported",
                  candidates: [],
                  redirect: `Live recognition failed: ${error.message}`,
                },
              });
            }
            return;
          }
          // Demo mode cannot recognise real photos, so it shows the honest fallback.
          go("unsupported", {
            sample: null,
            photoUrl,
            recognition: {
              status: "unsupported",
              candidates: [],
              redirect:
                "This demo can only recognise the sample photos. Pick one of those to carry on.",
            },
          });
        },
        pick(el) {
          const index = Number(el.dataset.index);
          const candidate = state.recognition.candidates[index];
          log("confirm", { choice: index, label: candidate.label, certainty: candidate.certainty });
          chooseTopic(candidate.topic ?? matchTopic(candidate.label), candidate.label);
        },
        correct(form) {
          const text = form.correction.value.trim();
          if (!text) return;
          const topic = matchTopic(text);
          log("correction", { length: text.length, matched: Boolean(topic) });
          chooseTopic(topic, text);
        },
        question(el) {
          const question = currentTopic().questions[Number(el.dataset.index)];
          log("question", { index: Number(el.dataset.index) });
          startLesson(question);
        },
        ownQuestion(form) {
          const question = form.question.value.trim();
          if (!question) return;
          log("question", { own: true, length: question.length });
          startLesson(question);
        },
        answer(form) {
          const choice = Number(new FormData(form).get("choice"));
          const kind = form.dataset.kind;
          const correct = choice === currentTopic().check.answer;
          log(kind === "pre" ? "precheck" : "postcheck", { choice, correct });
          if (kind === "pre") {
            go("lesson", {
              pre: choice,
              shown: 2,
              guesses: {},
              lessonStartedAt: performance.now(),
            });
          } else {
            go("result", { post: choice });
          }
        },
        level(el) {
          state.level = el.value;
          log("depth", { level: el.value, shown: state.shown });
          render();
          app.querySelector(`input[value="${el.value}"]`)?.focus();
        },
        deeper() {
          const index = state.shown;
          state.shown += 1;
          const { module } = currentTopic().steps[index];
          log("step", { step: index, module, variant: session.variant ?? "A" });
          render();
          const heading = document.querySelector(`#s-${index} h3`);
          heading?.setAttribute("tabindex", "-1");
          heading?.focus();
          heading?.scrollIntoView({ block: "start", behavior: "smooth" });
        },
        guess(form) {
          const index = Number(form.dataset.index);
          const choice = Number(new FormData(form).get("choice"));
          state.guesses[index] = choice;
          const correct = choice === currentTopic().steps[index].guess.answer;
          log("guess", { step: index, choice, correct });
          render();
          document.getElementById(`why-${index}`)?.focus();
        },
        finish() {
          log("finish", {
            shown: state.shown,
            level: state.level,
            seconds: Math.round((performance.now() - state.lessonStartedAt) / 1000),
          });
          go("postcheck");
        },
        explainBack(form) {
          log("explainBack", { length: form.text.value.trim().length });
          go("done");
        },
      };

      app.addEventListener(
        "toggle",
        (event) => {
          if (event.target.matches?.("details[data-evidence]") && event.target.open) {
            log("evidence", { step: Number(event.target.dataset.evidence) });
          }
        },
        true,
      );
      app.addEventListener("click", (event) => {
        const link = event.target.closest?.("a[data-source]");
        if (link) log("source", { title: link.dataset.source });
      });

      function defaultLevel() {
        return session.segment === "child 8-12" ? "simple" : "plain";
      }

      async function startLesson(question) {
        state.level = defaultLevel();
        if (!currentTopic().live) return go("precheck", { question });
        go("writing", { question });
        try {
          const lesson = await writeLiveLesson(currentTopic().label, question);
          if (lesson.safety.decision !== "allow") {
            log("safety", { decision: lesson.safety.decision });
            return go("unsupported", {
              recognition: {
                status: "unsupported",
                candidates: [],
                redirect: lesson.safety.learnerMessage,
              },
            });
          }
          Object.assign(currentTopic(), toTopic(lesson));
          go("precheck");
          checkLiveGuesses(currentTopic());
        } catch (error) {
          log("error", { where: "lesson", message: String(error.message).slice(0, 120) });
          go("unsupported", {
            recognition: {
              status: "unsupported",
              candidates: [],
              redirect: `Writing the lesson failed: ${error.message}`,
            },
          });
        }
      }

      function startRecognition(patch) {
        go("looking", { ...patch, photoUrl: null });
        const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 300 : 1600;
        setTimeout(() => {
          log("recognition", {
            status: patch.recognition.status,
            candidates: patch.recognition.candidates.length,
          });
          go("confirm");
        }, delay);
      }

      function matchTopic(label) {
        const text = label.toLowerCase();
        return Object.entries(DEMO.topics).find(([, topic]) =>
          topic.aliases.some((alias) => text.includes(alias)),
        )?.[0];
      }

      function chooseTopic(topic, label) {
        if (topic && DEMO.topics[topic]) return go("question", { topic });
        if (session.mode === "live" && metaKey()) {
          DEMO.topics.live = {
            label,
            aliases: [],
            live: true,
            questions: [
              `How does a ${label.toLowerCase()} work?`,
              "What is it made of, and why?",
              "Who invented it?",
            ],
          };
          return go("question", { topic: "live" });
        }
        go("nolesson", { requested: label });
      }

      // Mirrors lesson-p0.4 in @sbi/benchmark, with all three reading levels and a safety gate.
      const LESSON_SYSTEM = `You write short, accurate science lessons about everyday objects for a learning app used by people aged 8 and up. Lessons teach from first principles: the learner should be able to rebuild the answer from basic truths, not just remember it.
First decide safety: "allow" for normal curiosity; "redirect" or "refuse" if answering could lead to harm (eating wild plants, medicine doses, mixing chemicals, electricity, weapons) or the question isn't about science. If not "allow", leave other fields minimal and put a kind message for the learner in learnerMessage.
Write 8 to 12 steps, each tagged with a module from: ${MODULES.join(", ")}. In order:
1. "what-youre-seeing": what's in front of the learner, ending on the puzzle the question raises.
2. "short-answer": the answer in 1-2 sentences.
3. "first-principles", 1-2 steps: basic truths the learner can check or already trusts (e.g. energy isn't created, matter is made of moving particles). Explain any jargon.
4. "how-parts-work", 2-4 steps: reason from those truths through the object's parts to the answer, one small inference per step. Title the last one "Put it together"; it restates the answer as the conclusion of the chain.
5. "try-an-idea": a safe experiment that tests the reasoning. 6. "check-thinking": apply the idea to a new situation. 7. "history": how someone first worked it out. 8. "go-further".
Give most reasoning steps, and the check-thinking step, a guess: a question the learner can work out from the steps so far. guess is null elsewhere. For each guess, in this order:
- why: the correct answer and the reason, at three levels.
- correct: the right answer, as a short answer to that exact question, matching why.
- wrong: 1-2 tempting wrong answers to the same question.
Every answer must answer the question directly: if it asks what happens to the plunger, each one says what the plunger does.
Every text has three levels: simple (age 8), plain (teen or adult), technical. Every factual statement belongs to a claim citing sourceIds; use only real, well-known reference pages whose URL you are confident exists. "history" must cite a claim.
check: one multiple-choice question about the key idea, with correct (the right answer), wrong (2 tempting wrong answers to the same question) and explain (one sentence).
visual: the interactive model that best shows the mechanism, or "none" if none fits: "gears" (gear ratios, chains, bikes), "engine" (pistons, burning fuel, four-stroke engines), "lever" (levers, seesaws, crowbars, scissors, trading force for distance), "heating" (heating, boiling, temperature, how pressure changes boiling).`;

      const levelsSchema = {
        type: "object",
        additionalProperties: false,
        required: ["simple", "plain", "technical"],
        properties: {
          simple: { type: "string" },
          plain: { type: "string" },
          technical: { type: "string" },
        },
      };
      const LESSON_SCHEMA = {
        type: "object",
        additionalProperties: false,
        required: ["safety", "check", "visual", "steps", "claims", "sources"],
        properties: {
          // Listed here because KIT is declared further down; a test keeps the two in step.
          visual: { type: "string", enum: ["gears", "engine", "lever", "heating", "none"] },
          safety: {
            type: "object",
            additionalProperties: false,
            required: ["decision", "learnerMessage"],
            properties: {
              decision: { type: "string", enum: ["allow", "redirect", "refuse"] },
              learnerMessage: { type: "string" },
            },
          },
          check: {
            type: "object",
            additionalProperties: false,
            required: ["question", "correct", "wrong", "explain"],
            properties: {
              question: { type: "string" },
              correct: { type: "string" },
              wrong: { type: "array", items: { type: "string" } },
              explain: { type: "string" },
            },
          },
          steps: {
            type: "array",
            items: {
              type: "object",
              additionalProperties: false,
              required: ["module", "title", "text", "guess", "claimIds"],
              properties: {
                module: { type: "string", enum: MODULES },
                title: { type: "string" },
                text: levelsSchema,
                guess: {
                  type: ["object", "null"],
                  additionalProperties: false,
                  required: ["question", "why", "correct", "wrong"],
                  properties: {
                    question: { type: "string" },
                    why: levelsSchema,
                    correct: { type: "string" },
                    wrong: { type: "array", items: { type: "string" } },
                  },
                },
                claimIds: { type: "array", items: { type: "string" } },
              },
            },
          },
          claims: {
            type: "array",
            items: {
              type: "object",
              additionalProperties: false,
              required: ["claimId", "text", "sourceIds"],
              properties: {
                claimId: { type: "string" },
                text: { type: "string" },
                sourceIds: { type: "array", items: { type: "string" } },
              },
            },
          },
          sources: {
            type: "array",
            items: {
              type: "object",
              additionalProperties: false,
              required: ["sourceId", "title", "publisher", "url"],
              properties: {
                sourceId: { type: "string" },
                title: { type: "string" },
                publisher: { type: "string" },
                url: { type: "string" },
              },
            },
          },
        },
      };

      function writeLiveLesson(label, question) {
        return metaComplete(
          [
            { role: "system", content: LESSON_SYSTEM },
            { role: "user", content: `Object: ${label}\nLearner question: ${question}` },
          ],
          "LiveLesson",
          LESSON_SCHEMA,
          12000,
        );
      }

      // Mirrors placeGuess in @sbi/benchmark: the model names the right answer and code places it.
      function placeGuess({ question, correct, wrong, ...rest }) {
        const answer = question.length % (wrong.length + 1);
        const options = [...wrong];
        options.splice(answer, 0, correct);
        return { question, options, answer, ...rest };
      }

      function toTopic(lesson) {
        const check = placeGuess(lesson.check);
        const visual = KIT_NAMES.includes(lesson.visual) ? lesson.visual : null;
        // The model only names a model from the kit; the button goes on the first parts step.
        const visualAt = visual
          ? lesson.steps.findIndex((step) => step.module === "how-parts-work")
          : -1;
        return {
          visual,
          check: { ...check, options: [...check.options, "I'm not sure"] },
          steps: lesson.steps.map(({ claimIds, guess, ...step }, index) => ({
            ...step,
            claims: claimIds,
            ...(guess ? { guess: placeGuess(guess) } : {}),
            ...(index === visualAt ? { visual: true } : {}),
          })),
          claims: Object.fromEntries(
            lesson.claims.map((claim) => [
              claim.claimId,
              { text: claim.text, sources: claim.sourceIds },
            ]),
          ),
          sources: Object.fromEntries(
            lesson.sources.map(({ sourceId, ...source }) => [sourceId, source]),
          ),
        };
      }

      // Mirrors guess-judge-p0.2 in @sbi/benchmark.
      const GUESS_CHECK_SYSTEM = `You review multiple-choice guesses in science lessons for learners aged 8 and up.
For each numbered guess, decide whether it fits. Wrong options are meant to be wrong; that is not a problem. It fits when both hold:
- every option is a possible answer to the question exactly as asked, even if wrong (if it asks what happens to a plunger, every option says what the plunger does);
- the marked answer is the correct one.
Set fits to false only if one of these fails, and give the problem in one short sentence; otherwise problem is null.`;
      const GUESS_CHECK_SCHEMA = {
        type: "object",
        additionalProperties: false,
        required: ["verdicts"],
        properties: {
          verdicts: {
            type: "array",
            items: {
              type: "object",
              additionalProperties: false,
              required: ["index", "fits", "problem"],
              properties: {
                index: { type: "integer" },
                fits: { type: "boolean" },
                problem: { type: ["string", "null"] },
              },
            },
          },
        },
      };

      // Runs while the learner does the pre-check; a guess that fails is shown as a plain explanation.
      async function checkLiveGuesses(topic) {
        const guessed = topic.steps.flatMap((step, stepIndex) =>
          step.guess ? [{ step, stepIndex }] : [],
        );
        if (!guessed.length) return;
        const listing = guessed
          .map(({ step, stepIndex }, index) => {
            const { question, options, answer } = step.guess;
            const choices = options.map((option, n) => `  ${n}. ${option}`).join("\n");
            return `Guess ${index} (step ${stepIndex})\nStep "${step.title}": ${step.text.plain}\nQuestion: ${question}\n${choices}\nMarked answer: ${answer}`;
          })
          .join("\n\n");
        try {
          const { verdicts } = await metaComplete(
            [
              { role: "system", content: GUESS_CHECK_SYSTEM },
              { role: "user", content: listing },
            ],
            "GuessVerdicts",
            GUESS_CHECK_SCHEMA,
            4000,
          );
          const dropped = verdicts.flatMap((verdict) => {
            const hit = !verdict.fits && guessed[verdict.index];
            if (!hit || state.guesses[hit.stepIndex] !== undefined) return [];
            hit.step.guess.dropped = true;
            return [hit.stepIndex];
          });
          log("guessCheck", { checked: guessed.length, dropped: dropped.length });
          if (dropped.some((index) => index < state.shown) && state.screen === "lesson") render();
        } catch (error) {
          log("error", { where: "guessCheck", message: String(error.message).slice(0, 120) });
        }
      }

      async function downscale(file) {
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, 768 / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", 0.8);
      }

      async function metaComplete(messages, name, schema, maxTokens) {
        const response = await fetch(META_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${metaKey()}` },
          body: JSON.stringify({
            model: session.model,
            messages,
            max_tokens: maxTokens,
            reasoning_effort: "low",
            response_format: { type: "json_schema", json_schema: { name, schema, strict: true } },
          }),
        });
        if (!response.ok) throw new Error(`Meta API returned ${response.status}`);
        const data = await response.json();
        return JSON.parse(data.choices[0].message.content);
      }

      // Mirrors RECOGNITION_PROMPT_VERSION recognition-p0.1 in @sbi/recognition.
      const RECOGNITION_SYSTEM = `You identify the main everyday object in a photo for a science-learning app used by people aged 8 and up.
Return up to 3 candidate labels, most likely first, each a short common noun phrase (e.g. "bicycle", "electric kettle").
certainty: "likely" only when you would bet on it, "possible" when plausible, "unsure" otherwise; calibratedConfidence is your probability from 0 to 1.
status: "recognised" when the top candidate is clearly identifiable; "ambiguous" when two or more candidates are similarly plausible or key details are hidden; "unsupported" when the photo shows medicine, people as the subject, personal documents, or nothing identifiable, with no candidates.
observations: up to 3 short visual details that justify your answer. Never describe people.`;

      const RECOGNITION_SCHEMA = {
        type: "object",
        additionalProperties: false,
        required: ["status", "candidates", "observations"],
        properties: {
          status: { type: "string", enum: ["recognised", "ambiguous", "unsupported"] },
          candidates: {
            type: "array",
            items: {
              type: "object",
              additionalProperties: false,
              required: ["label", "certainty", "calibratedConfidence", "reasons"],
              properties: {
                label: { type: "string" },
                certainty: { type: "string", enum: ["likely", "possible", "unsure"] },
                calibratedConfidence: { type: "number" },
                reasons: { type: "array", items: { type: "string" } },
              },
            },
          },
          observations: { type: "array", items: { type: "string" } },
        },
      };

      async function recogniseLive(photoUrl) {
        const output = await metaComplete(
          [
            { role: "system", content: RECOGNITION_SYSTEM },
            {
              role: "user",
              content: [
                { type: "text", text: "What is the main object in this photo?" },
                { type: "image_url", image_url: { url: photoUrl } },
              ],
            },
          ],
          "RecognitionOutput",
          RECOGNITION_SCHEMA,
          2000,
        );
        const candidates = output.candidates.slice(0, 3).map((candidate) => ({
          label: candidate.label.replace(/^./, (ch) => ch.toUpperCase()),
          certainty: candidate.certainty,
        }));
        return { status: output.status, candidates };
      }

      const THREE_URL = "three";
      const ADDONS_URL = "three/addons/";
      const FORMATS = {
        svg: "A labelled diagram",
        glb: "A 3D model you can turn",
        sim: "A simulation you can change",
      };
      // Latin square: across every three participants each format appears once in each position.

      function gearPath(cx, cy, teeth, pitch) {
        const outer = pitch + 6;
        const root = pitch - 6;
        const step = (Math.PI * 2) / teeth;
        let d = "";
        for (let i = 0; i < teeth; i += 1) {
          const a = i * step;
          const pts = [
            [root, a],
            [outer, a + step * 0.2],
            [outer, a + step * 0.45],
            [root, a + step * 0.65],
          ];
          pts.forEach(([r, angle], index) => {
            d += `${i === 0 && index === 0 ? "M" : "L"}${(cx + r * Math.cos(angle)).toFixed(1)} ${(cy + r * Math.sin(angle)).toFixed(1)} `;
          });
        }
        return d + "Z";
      }

        function drawGear(x, y, teeth, scale, rotation, color) {
          const pitch = teeth * scale;

              [pitch - 6, a],
              [pitch + 6, a + s * 0.2],

              [pitch - 6, a + s * 0.65],
            ].forEach(([r, t], index) =>
              ctx[i === 0 && index === 0 ? "moveTo" : "lineTo"](r * Math.cos(t), r * Math.sin(t)),
            );
          }
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = css.getPropertyValue("--paper");
          ctx.beginPath();
          ctx.arc(0, 0, pitch * 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(-2, -pitch * 0.85, 4, pitch * 0.55);
          ctx.restore();
        }

      // Tooth pitch is the same on every sprocket, so radius grows with tooth count and one chain fits all.
      const TOOTH = 0.045;
      const CENTRES = 5;

      function gearShape(THREE, teeth) {
        const pitch = teeth * TOOTH;
        const shape = new THREE.Shape();
        const step = (Math.PI * 2) / teeth;
        for (let i = 0; i < teeth; i += 1) {
          const a = i * step;
          [
            [pitch - 0.09, a],
            [pitch + 0.09, a + step * 0.2],
            [pitch + 0.09, a + step * 0.45],
            [pitch - 0.09, a + step * 0.65],
          ].forEach(([r, t], index) =>
            shape[i === 0 && index === 0 ? "moveTo" : "lineTo"](r * Math.cos(t), r * Math.sin(t)),
          );
        }
        const hole = new THREE.Path();
        hole.absarc(0, 0, pitch * 0.28, 0, Math.PI * 2, true);
        shape.holes.push(hole);
        return new THREE.ExtrudeGeometry(shape, { depth: 0.16, bevelEnabled: false });
      }

      // Open-belt path around both sprockets, sampled by distance so links can slide along it.
      function chainPath(r1, r2) {
        const x1 = -CENTRES / 2;
        const x2 = CENTRES / 2;
        const phi = Math.asin((r1 - r2) / CENTRES);
        const top = Math.PI / 2 + phi;
        const segments = [
          {
            kind: "line",
            from: [x1 + r1 * Math.cos(top), r1 * Math.sin(top)],
            to: [x2 + r2 * Math.cos(top), r2 * Math.sin(top)],
          },
          { kind: "arc", cx: x2, r: r2, start: top, sweep: -2 * top },
          {
            kind: "line",
            from: [x2 + r2 * Math.cos(-top), r2 * Math.sin(-top)],
            to: [x1 + r1 * Math.cos(-top), r1 * Math.sin(-top)],
          },
          { kind: "arc", cx: x1, r: r1, start: -top, sweep: -(2 * Math.PI - 2 * top) },
        ].map((segment) => ({
          ...segment,
          length:
            segment.kind === "line"
              ? Math.hypot(segment.to[0] - segment.from[0], segment.to[1] - segment.from[1])
              : Math.abs(segment.sweep) * segment.r,
        }));
        const total = segments.reduce((sum, segment) => sum + segment.length, 0);
        const at = (distance) => {
          let d = ((distance % total) + total) % total;
          for (const segment of segments) {
            if (d <= segment.length) {
              const f = d / segment.length;
              if (segment.kind === "line") {
                const [ax, ay] = segment.from;
                const [bx, by] = segment.to;
                return {
                  x: ax + (bx - ax) * f,
                  y: ay + (by - ay) * f,
                  angle: Math.atan2(by - ay, bx - ax),
                };
              }
              const t = segment.start + segment.sweep * f;
              return {
                x: segment.cx + segment.r * Math.cos(t),
                y: segment.r * Math.sin(t),
                angle: t - Math.PI / 2,
              };
            }
            d -= segment.length;
          }
          return { x: 0, y: 0, angle: 0 };
        };
        return { total, at };
      }

      /** Builds the drivetrain in code, so the 3D view works from a single file with any tooth counts. */
      function buildDrivetrain(THREE, front, back) {
        const css = getComputedStyle(document.documentElement);
        const color = (name) => new THREE.Color(css.getPropertyValue(name).trim() || "#888");
        const group = new THREE.Group();
        const metal = (name) =>
          new THREE.MeshStandardMaterial({ color: color(name), metalness: 0.3, roughness: 0.5 });
        const ring = new THREE.Group();
        ring.position.x = -CENTRES / 2;
        ring.add(new THREE.Mesh(gearShape(THREE, front), metal("--action")));
        const crank = new THREE.Mesh(new THREE.BoxGeometry(0.16, 2.1, 0.12), metal("--ink"));
        crank.position.set(0, -1.05, 0.3);
        const pedal = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.22, 0.3), metal("--ink"));
        pedal.position.set(0, -2.05, 0.5);
        ring.add(crank, pedal);
        const cog = new THREE.Group();
        cog.position.x = CENTRES / 2;
        cog.add(new THREE.Mesh(gearShape(THREE, back), metal("--highlight")));
        const wheel = new THREE.Group();
        wheel.position.set(CENTRES / 2, 0, -0.5);
        const tyre = new THREE.Mesh(new THREE.TorusGeometry(3.1, 0.12, 8, 64), metal("--ink"));
        wheel.add(tyre);
        for (let i = 0; i < 12; i += 1) {
          const spoke = new THREE.Mesh(
            new THREE.CylinderGeometry(0.015, 0.015, 3.1),
            metal("--ink-soft"),
          );
          spoke.rotation.z = (i / 12) * Math.PI;
          wheel.add(spoke);
        }
        const valve = new THREE.Mesh(new THREE.SphereGeometry(0.16), metal("--highlight"));
        valve.position.y = 3.1;
        wheel.add(valve);
        const path = chainPath(front * TOOTH, back * TOOTH);
        const pitch = (Math.PI * 2 * front * TOOTH) / front;
        const count = Math.round(path.total / pitch);
        const links = new THREE.InstancedMesh(
          new THREE.BoxGeometry(pitch * 0.8, 0.07, 0.1),
          metal("--ink"),
          count,
        );
        links.position.z = 0.08;
        group.add(wheel, ring, cog, links);
        const dummy = new THREE.Object3D();
        const placeLinks = (offset) => {
          for (let i = 0; i < count; i += 1) {
            const point = path.at(offset + (i * path.total) / count);
            dummy.position.set(point.x, point.y, 0);
            dummy.rotation.z = point.angle;
            dummy.updateMatrix();
            links.setMatrixAt(i, dummy.matrix);
          }
          links.instanceMatrix.needsUpdate = true;
        };
        placeLinks(0);
        const dispose = () =>
          group.traverse((object) => {
            object.geometry?.dispose();
            object.material?.dispose();
          });
        return { group, ring, cog, wheel, placeLinks, radius: front * TOOTH, dispose };
      }
